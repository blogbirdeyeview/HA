# 2026-06-28
blueprint:
  name: Prego - Config Lack of sunlight - By sun prego v0.14
  description: >
    Config - defines the boolean for the lack of light, guided by the sunrise and sunset settings -- lack of sunlight.
    The automation also reacts when the configured sunrise or sunset helper values change.
    The automation includes optionally features such as preventing activation when away from home and considering stealth mode.
    It also recalculates on Home Assistant startup.
  domain: automation
  homeassistant:
    min_version: 2024.6.0
  # Tab necesario por inputs
  #
  #---------------
  # Inputs
  #---------------

  input:
    #*** Filters
    in_away_from_home:
      name: Away from home
      description: Optional indicator that means nobody is currently home (travel).
      default: ''
      selector:
        entity:
          domain: input_boolean

    in_stealth_mode:
      name: Stealth mode
      description: Optional indicator(s) used to block automatic turn-on, for example when people are sleeping or you want to avoid visible activity.
      default: []
      selector:
        entity:
          domain: input_boolean
          multiple: true

    #*** Custum Time Prego
    in_time_morning:
      name: Sunrise Helper *
      description: Choose the time helper corresponding to sunrise.
      selector:
        entity:
          domain: input_datetime

    in_time_night:
      name: Sunset Helper *
      description: Choose the time helper corresponding to sunset.
      selector:
        entity:
          domain: input_datetime

    # Targets
    in_target_entity_control:
      name: Lack of Sunlight Indicator
      description: Boolean that reflects the lack of sunlight.
      selector:
        entity:
          domain: input_boolean

#---------------
# Variables
#---------------

variables:
  var_away_from_home: !input in_away_from_home
  var_stealth_mode: !input in_stealth_mode
  var_bol_away_from_home: >
    {% if not var_away_from_home %}
      {{ false }}
    {% else %}
      {{ is_state(var_away_from_home, 'on') | bool }}
    {% endif %}
  var_bol_stealth_mode: >
    {% if not var_stealth_mode or (var_stealth_mode | length == 0) %}
      {{ false }}
    {% else %}
    {{
      (expand(var_stealth_mode)
      | selectattr('state', 'eq', 'on')
      | list
      | count > 0)
      | bool
    }}
    {% endif %}

#---------------
# Triggers
#---------------

trigger:
  # Recalculate on Home Assistant startup
  - platform: homeassistant
    event: start
    id: trigger_homeassistant_start

  - platform: time
    at: !input in_time_morning
    id: trigger_time_morning

  - platform: time
    at: !input in_time_night
    id: trigger_time_night

  - platform: state
    entity_id: !input in_time_morning
    id: trigger_helper_morning_changed

  - platform: state
    entity_id: !input in_time_night
    id: trigger_helper_night_changed

#---------------
# Conditions
#---------------

condition: []

#---------------
# Actions
#---------------

action:
  # If current time is inside the night window and there are no blocking flags,
  # turn ON the lack of sunlight indicator. Otherwise turn it OFF.
  - if:
      - condition: time
        after: !input in_time_night
        before: !input in_time_morning
      - condition: template
        value_template: '{{ not var_bol_away_from_home }}'
      # Someone is home
      - condition: template
        value_template: '{{ not var_bol_stealth_mode }}'
      # Stealth mode is not active (No ninjas)
    then:
      - service: input_boolean.turn_on
        target:
          entity_id: !input in_target_entity_control
    else:
      - service: input_boolean.turn_off
        target:
          entity_id: !input in_target_entity_control

#---------------
# mode
#---------------

mode: restart
