# 2026-06-28
blueprint:
  name: Prego - Config Lack of sunlight - By sun prego v0.20
  description: >
    Config - defines the boolean for the lack of light, guided by the sunrise and sunset settings -- lack of sunlight.
    The automation also reacts when the configured sunrise or sunset helper values change.
    The automation includes optionally features such as preventing activation when away from home and considering stealth mode.
    It also recalculates on Home Assistant startup.
  domain: automation
  homeassistant:
    min_version: 2024.6.0
  # Tab necesario por inputs
  #
  #---------------
  # Inputs
  #---------------

  input:
    #*** Filters
    in_away_from_home:
      name: Away from home
      description: Optional helper that indicates when nobody is home.
      default: ''
      selector:
        entity:
          domain: input_boolean

    in_stealth_mode:
      name: Stealth mode
      description: Optional helpers that block automatic activation while any of them is on.
      default: []
      selector:
        entity:
          domain: input_boolean
          multiple: true

    #*** Custum Time Prego
    in_time_morning:
      name: Sunrise time helper
      description: Time-only helper that marks when darkness ends.
      selector:
        entity:
          domain: input_datetime

    in_time_night:
      name: Sunset time helper
      description: Time-only helper that marks when darkness starts.
      selector:
        entity:
          domain: input_datetime

    # Targets
    in_target_entity_control:
      name: Lack of Sunlight Indicator
      description: Boolean that reflects the lack of sunlight.
      selector:
        entity:
          domain: input_boolean

#---------------
# Variables
#---------------

variables:
  in_ji_away_from_home: !input in_away_from_home
  in_ji_stealth_mode: !input in_stealth_mode
  var_bol_away_from_home: >
    {% if not in_ji_away_from_home %}
      {{ false }}
    {% else %}
      {{ is_state(in_ji_away_from_home, 'on') | bool }}
    {% endif %}
  #--- Block-var
  var_bol_stealth_mode: >
    {% if not in_ji_stealth_mode or (in_ji_stealth_mode | length == 0) %}
      {{ false }}
    {% else %}
    {{
      (expand(in_ji_stealth_mode)
      | selectattr('state', 'eq', 'on')
      | list
      | count > 0)
      | bool
    }}
    {% endif %}

#---------------
# Triggers
#---------------

trigger:
  # Recalculate on Home Assistant startup
  - platform: homeassistant
    alias: Home Assistant started
    event: start
    id: trigger_ha_start

  - platform: time
    alias: Sunrise
    at: !input in_time_morning
    id: trigger_time_morning

  - platform: time
    alias: Sunset
    at: !input in_time_night
    id: trigger_time_night

  - platform: state
    alias: Sunrise helper changed
    entity_id: !input in_time_morning
    id: trigger_helper_morning_changed

  - platform: state
    alias: Sunset helper changed
    entity_id: !input in_time_night
    id: trigger_helper_night_changed

#---------------
# Conditions
#---------------

condition: []

#---------------
# Actions
#---------------

action:
  # If current time is inside the night window and there are no blocking flags,
  # turn ON the lack of sunlight indicator. Otherwise turn it OFF.
  - if:
      - alias: 'Current time is between sunset and sunrise'
        condition: time
        after: !input in_time_night
        before: !input in_time_morning
      - alias: 'Someone is home'
        condition: template
        value_template: '{{ not var_bol_away_from_home }}'
        # Someone is home

      - alias: 'Stealth mode is inactive'
        condition: template
        value_template: '{{ not var_bol_stealth_mode }}'
        # Stealth mode is not active (No ninjas)
    then:
      - service: input_boolean.turn_on
        target:
          entity_id: !input in_target_entity_control
    else:
      - service: input_boolean.turn_off
        target:
          entity_id: !input in_target_entity_control

#---------------
# mode
#---------------

mode: restart
