# 2026-02-14
blueprint:
  name: Prego - Automatic switches/lights - By motion detection v5.3
  description: |
    Automatically controls one or more lights/switches using a motion sensor.
    - Turns the target(s) ON when motion is detected
    - Turns the target(s) OFF after a configurable no-motion timeout.
    - Turns the target(s) OFF at 02:00 as a daily safety shutdown (if any target is ON).

    * Optional "keep-alive" motion sensor can prevent turning OFF if motion is still present.
    * Optional filters include "away from home" and "stealth mode" to prevent turning ON while those flags are active.
    * Optional post-reboot SafeOff: when Home Assistant starts, turns OFF the target(s) if there is no motion.
  domain: automation
  #
  #---------------
  # input
  #---------------

  input:
    in_motion_sensor:
      name: Motion sensor
      description: Choose the motion sensor that covers the designated area for evaluation.
      selector:
        entity:
          domain: binary_sensor
    in_motion_sensor_keep_alive:
      name: Motion sensor (keep alive only)
      description: Optional sensor that prevents turning off the light if motion is still detected.
      default: ''
      selector:
        entity:
          domain: binary_sensor
    in_inactivity_timeout:
      name: No motion duration
      description: Time to trigger after no motion detected.
      default:
        hours: 0
        minutes: 2
        seconds: 0
      selector:
        duration: {}
    #*** Filter
    in_away_from_home:
      name: Are you away from home?
      description: Indicator signaling no one is at home (travel / away status).
      default: ''
      selector:
        entity:
          domain: input_boolean
    in_stealth_mode:
      name: Are you in stealth mode?
      description: Indicator signaling that you want to be a ninja at home (everyone sleeping / suspicious noise).
      default: []
      selector:
        entity:
          domain: input_boolean
          multiple: true
    #*** Config
    in_enable_safeoff_post_restart:
      name: SafeOff post-reboot
      description: If enabled, Home Assistant will turn off the target devices when it starts if there is no movement.
      default: false
      selector:
        boolean:
    #*** Action
    in_target_entity_control:
      name: Target switch/light to control
      description: Choose the switches/lights that you want to control automatically.
      selector:
        entity:
          domain:
            - switch
            - light
          multiple: true

#---------------
# variables
#---------------

trigger_variables:
  var_motion_sensor_keep_alive: !input in_motion_sensor_keep_alive
  var_away_from_home: !input in_away_from_home
  var_stealth_mode: !input in_stealth_mode
  var_enable_safeoff_post_restart: !input in_enable_safeoff_post_restart
  var_target_entities: !input in_target_entity_control

variables:
  var_bol_motion_sensor_keep_alive: >
    {% if not var_motion_sensor_keep_alive %}
      {{ false }}
    {% else %}
      {{ is_state(var_motion_sensor_keep_alive, 'on') | bool }}
    {% endif %}
  var_bol_away_from_home: >
    {% if not var_away_from_home %}
      {{ false }}
    {% else %}
      {{ is_state(var_away_from_home, 'on') | bool }}
    {% endif %}
  var_bol_stealth_mode: >
    {% if not var_stealth_mode or (var_stealth_mode | length == 0) %}
      {{ false }}
    {% else %}
      {{
        (expand(var_stealth_mode)
          | selectattr('state', 'eq', 'on')
          | list
          | count > 0)
        | bool
      }}
    {% endif %}
  var_bol_any_target_on: >-
    {{ expand(var_target_entities)
      | selectattr('state', 'eq', 'on')
      | list
      | count > 0 }}
  var_bol_any_target_offish: >-
    {{ expand(var_target_entities)
      | selectattr('state', 'in', ['off','unavailable','unknown'])
      | list
      | count > 0 }}

#---------------
# Automation to turn ON when motion is detected.
#---------------

trigger:
  - platform: state
    entity_id: !input 'in_motion_sensor'
    id: trigger_motion_start
    to: 'on'
  - platform: state
    entity_id: !input 'in_motion_sensor'
    id: trigger_motion_end
    to: 'off'
    for: !input in_inactivity_timeout
  - platform: template
    id: trigger_motion_end_keep_alive
    value_template: >
      {% if var_motion_sensor_keep_alive is not none and var_motion_sensor_keep_alive != '' %}
        {{ is_state(var_motion_sensor_keep_alive, 'off') }}
      {% else %}
        false
      {% endif %}
    for: !input in_inactivity_timeout
  - platform: time
    at: '02:00:00'
    id: trigger_time_02am
  - platform: homeassistant
    event: start
    id: trigger_ha_start

#---------------
# conditions
#---------------

condition:
  - condition: template
    # Checks if at least one light is OFF (ready to turn ON)
    # Checks if at least one light is ON (ready to turn OFF)
    value_template: >
      {{
        (trigger.id == 'trigger_motion_start' and var_bol_any_target_offish) 
        or
        (trigger.id == 'trigger_motion_end' and var_bol_any_target_on) 
        or
        (trigger.id == 'trigger_motion_end_keep_alive' and var_bol_any_target_on) 
        or
        (trigger.id == 'trigger_time_02am' or trigger.id == 'trigger_ha_start')
      }}

#---------------
# Actions
#---------------

action:
  #  - service: logbook.log
  #    data:
  #      message: 'Valor de la VAR var_stealth_mode: {{ states(var_stealth_mode) }}'
  #      name: 'var_stealth_mode'
  #  - service: logbook.log
  #    data:
  #      message: 'Valor de la VAR var_bol_stealth_mode: {{ var_bol_stealth_mode }}'
  #      name: 'var_bol_stealth_mode'
  #  - service: logbook.log
  #    data:
  #      message: 'Valor de la VAR var_bol_away_from_home: {{ var_bol_away_from_home }}'
  #      name: 'var_bol_away_from_home'
  #- service: logbook.log
  #  data:
  #    name: 'DEBUG - Automática por movimiento'
  #    message: |
  #      ---
  #      🧩 DEBUG VARIABLES
  #      - trigger.id: {{ trigger.id }}
  #      - var_away_from_home: {{ var_away_from_home }}
  #      - state(var_away_from_home): {% if var_away_from_home %}{{ states(var_away_from_home) }}{% else %}N/A{% endif %}
  #      - var_bol_away_from_home: {{ var_bol_away_from_home }}
  #      - var_stealth_mode: {{ var_stealth_mode }}
  #      - estados_stealth_mode: {% if var_stealth_mode | length > 0 %}{{ expand(var_stealth_mode) | map(attribute='entity_id') | list }}{% else %}N/A{% endif %}
  #      - var_bol_stealth_mode: {{ var_bol_stealth_mode }}
  #      ---

  - choose:
      #---------------
      # Case 1 - To turn ON the light when motion is detected.
      #---------------
      - alias: 'Turn ON when motion detected'
        conditions:
          - condition: trigger
            id:
              - trigger_motion_start
        sequence:
          - condition: template
            value_template: '{{ not var_bol_away_from_home }}'
            # In home
          - condition: template
            value_template: '{{ not var_bol_stealth_mode }}'
            # No ninjas at home
          - condition: state
            entity_id: !input 'in_motion_sensor'
            state: 'on'
            # Motion detected
          - service: homeassistant.turn_on
            target:
              entity_id: !input 'in_target_entity_control'
          # LOG
      #          - service: logbook.log
      #             data:
      #              message: 'Case 1: Turn on the switch/light'
      #              name: 'Case RUN'

      #---------------
      # Case 2 - To turn OFF the light when movement is finished.
      #---------------
      - alias: 'Turn OFF when no motion'
        conditions:
          - condition: trigger
            id:
              - trigger_motion_end
              - trigger_motion_end_keep_alive
        sequence:
          - condition: state
            entity_id: !input 'in_motion_sensor'
            state: 'off'
          - condition: state
            entity_id: !input 'in_motion_sensor'
            state: 'off'
            for: !input in_inactivity_timeout
          - condition: template
            value_template: '{{ not var_bol_motion_sensor_keep_alive }}'
            # keep alive is OFF
          - service: homeassistant.turn_off
            target:
              entity_id: !input 'in_target_entity_control'
          # LOG
      #          - service: logbook.log
      #            data:
      #              message: 'Case 2: Turn off the switch/light'
      #              name: 'Case RUN'

      #---------------
      # Case SAFE - Turn OFF by time (02:00)
      #---------------
      - alias: '02:00 Safety shutdown: turn OFF target(s)'
        conditions:
          - condition: trigger
            id:
              - trigger_time_02am
        sequence:
          - alias: 'Check: at least one target is ON'
            condition: template
            value_template: '{{ var_bol_any_target_on }}'

          - service: homeassistant.turn_off
            target:
              entity_id: !input 'in_target_entity_control'
          - alias: 'Notify: safety shutdown executed'
            service: persistent_notification.create
            data:
              title: 'Lights off by protector time'
              message: 'The lights/switches were turned off by programming (02:00) because they were on.'

      #---------------
      # Case SAFE - Turn OFF after Home Assistant restart
      #---------------
      - alias: 'Post-restart SafeOff: turn OFF target(s)'
        conditions:
          - condition: trigger
            id:
              - trigger_ha_start
        sequence:
          - alias: 'Safety toggle enabled?'
            condition: template
            value_template: '{{ var_enable_safeoff_post_restart }}'
          - alias: 'Wait for Home Assistant to finish starting up'
            delay: '00:00:35'
          - alias: 'Check: no motion detected'
            condition: state
            entity_id: !input in_motion_sensor
            state: 'off'
          - alias: 'Check: at least one target is ON'
            condition: template
            value_template: '{{ var_bol_any_target_on }}'

          - service: homeassistant.turn_off
            target:
              entity_id: !input 'in_target_entity_control'

mode: single
