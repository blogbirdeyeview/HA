# 2026-02-14
blueprint:
  name: Prego - Config Wake up to configurable actions at next alarm v2.14
  description: >-
    Runs configurable actions before your next alarm.
    The blueprint listens to an alarm timestamp (from the Home Assistant mobile app) and writes an offset time
    into an input_datetime helper. When that helper time is reached, it executes your chosen actions.
    Optional filters: away from home, stealth mode, and an optional time window (can cross midnight).

    Recommended: use an input_datetime helper with both date and time enabled.
  domain: automation
  #
  #---------------
  # input
  #---------------

  input:
    in_offset:
      name: Time Offset
      description: How many minutes before the next alarm the actions should run.
      default: 30
      selector:
        number:
          min: 0.0
          max: 120.0
          mode: box
          step: 1.0
          unit_of_measurement: minutes

    in_alarm_source:
      name: Alarm Source
      description: Select the alarm timestamp entity provided by the Home Assistant mobile app.
      selector:
        entity:
          integration: mobile_app
          device_class: timestamp
          multiple: false

    in_alarm_helper:
      name: Alarm Helper
      description: Select the input_datetime helper that will store the alarm time minus the offset (recommended date + time).
      selector:
        entity:
          domain: input_datetime
          multiple: false

    #*** Filter
    in_away_from_home:
      name: Are you away from home?
      description: Indicator signaling no one is at home (travel / away status).
      default: ''
      selector:
        entity:
          domain: input_boolean

    in_stealth_mode:
      name: Are you in stealth mode?
      description: Indicator signaling that you want to be a ninja at home (everyone sleeping / suspicious noise).
      default: []
      selector:
        entity:
          domain: input_boolean
          multiple: true

    #*** Config
    in_clock_in_time:
      name: Time window start
      description: From what time will this automation work?
      default: '20:00:00'
      selector:
        time: {}

    in_clock_out_time:
      name: Time window End
      description: Until what time will this automation work?
      default: '07:00:00'
      selector:
        time: {}

    #*** Action
    in_actions:
      name: Actions
      description: Actions to run when the offset time (alarm minus offset) is reached.
      default: []
      selector:
        action: {}

#---------------
# variables
#---------------

trigger_variables:
  var_offset: !input in_offset
  var_away_from_home: !input in_away_from_home
  var_stealth_mode: !input in_stealth_mode

variables:
  var_bol_away_from_home: >
    {% if not var_away_from_home %}
    {{ false }}
    {% else %}
    {{ is_state(var_away_from_home, 'on') | bool }}
    {% endif %}
  var_bol_stealth_mode: >
    {% if not var_stealth_mode or (var_stealth_mode | length == 0) %}
    {{ false }}
    {% else %}
    {{
      (expand(var_stealth_mode)
      | selectattr('state', 'eq', 'on')
      | list
      | count > 0)
      | bool
    }}
    {% endif %}

trigger:
  - platform: time
    at: !input in_alarm_helper
    id: wake_up

  - platform: state
    entity_id:
      - !input in_alarm_source
    id: helper_update

#---------------
# Actions
#---------------

action:
  - choose:
      #---------------
      # Case 1 - Config Update helper with (alarm timestamp - offset)
      #---------------
      - alias: 'Set helper datetime offset'
        conditions:
          - condition: trigger
            id: helper_update
          - condition: template
            value_template: >
              {% set new_state = trigger.to_state.state %}
              {{ new_state is not none and new_state not in ["unknown", "unavailable"] }}
        sequence:
          - variables:
              var_alarm_offset_ts: >
                {{ (as_timestamp(trigger.to_state.state) | int(0)) - ((var_offset | int(0)) * 60) }}

          - service: input_datetime.set_datetime
            data:
              timestamp: >
                {{ var_alarm_offset_ts | int(0) }}
            target:
              entity_id: !input in_alarm_helper

      #---------------
      # Case 2 - Execute wake-up actions (at helper time)
      #---------------
      - alias: 'Wake-up: run configured actions'
        conditions:
          - condition: trigger
            id: wake_up
        sequence:
          - alias: 'Filter: someone is home'
            condition: template
            value_template: '{{ not var_bol_away_from_home }}'

          - alias: 'Filter: not in stealth mode'
            condition: template
            value_template: '{{ not var_bol_stealth_mode }}'

          - alias: 'Time window: only between start and end'
            condition: time
            after: !input in_clock_in_time
            before: !input in_clock_out_time

          - sequence: !input in_actions

    default: []

#---------------
# mode
#---------------

mode: single
