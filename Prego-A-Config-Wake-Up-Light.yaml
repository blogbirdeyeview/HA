# 2026-02-14
blueprint:
  name: Prego - Config Wake up to configurable actions at next alarm v2.22
  description: >-
    Runs configurable actions before your next alarm.
    The blueprint listens to an alarm timestamp (from the Home Assistant mobile app) and writes an offset time
    into an input_datetime helper. When that helper time is reached, it executes your chosen actions.
    Optional filters: away from home, stealth mode, and an optional time window (can cross midnight).

    Recommended: use an input_datetime helper with both date and time enabled.
  domain: automation
  homeassistant:
    min_version: 2024.6.0
  # Tab necesario por inputs
  #
  #---------------
  # Inputs
  #---------------

  input:
    in_offset:
      name: Time Offset
      description: How many minutes before the next alarm the actions should run.
      default: 30
      selector:
        number:
          min: 0.0
          max: 120.0
          mode: box
          step: 1.0
          unit_of_measurement: minutes

    in_alarm_source:
      name: Alarm Source
      description: Select the alarm timestamp entity provided by the Home Assistant mobile app.
      selector:
        entity:
          integration: mobile_app
          device_class: timestamp
          multiple: false

    in_alarm_helper:
      name: Alarm Helper
      description: Select the input_datetime helper that will store the alarm time minus the offset (recommended date + time).
      selector:
        entity:
          domain: input_datetime
          multiple: false

    #*** Filters
    in_away_from_home:
      name: Away from home
      description: Optional helper that indicates when nobody is home.
      default: ''
      selector:
        entity:
          domain: input_boolean

    in_stealth_mode:
      name: Stealth mode
      description: Optional helpers that block automatic activation while any of them is on.
      default: []
      selector:
        entity:
          domain: input_boolean
          multiple: true

    # Motion/light activation quiet window
    in_quiet_window_start:
      name: Quiet hours start
      description: Start time for quiet hours, when automatic activation is blocked.
      default: '23:00:00'
      selector:
        time: {}

    in_quiet_window_end:
      name: Quiet hours end
      description: End time for quiet hours, when automatic activation can resume.
      default: '07:00:00'
      selector:
        time: {}

    #*** Action
    in_actions:
      name: Actions
      description: Actions to run when the offset time (alarm minus offset) is reached.
      default: []
      selector:
        action: {}

#---------------
# Variables
#---------------

variables:
  in_ji_offset: !input in_offset
  in_ji_away_from_home: !input in_away_from_home
  in_ji_stealth_mode: !input in_stealth_mode
  var_bol_away_from_home: >
    {% if not in_ji_away_from_home %}
      {{ false }}
    {% else %}
      {{ is_state(in_ji_away_from_home, 'on') | bool }}
    {% endif %}
  #--- Block-var
  var_bol_stealth_mode: >
    {% if not in_ji_stealth_mode or (in_ji_stealth_mode | length == 0) %}
      {{ false }}
    {% else %}
    {{
      (expand(in_ji_stealth_mode)
      | selectattr('state', 'eq', 'on')
      | list
      | count > 0)
      | bool
    }}
    {% endif %}

trigger:
  - platform: time
    alias: Scheduled wake-up time reached
    at: !input in_alarm_helper
    id: wake_up

  - platform: state
    alias: Next alarm changed
    entity_id:
      - !input in_alarm_source
    id: helper_update

#---------------
# Actions
#---------------

action:
  - choose:
      #---------------
      # Case 1 - Config Update helper with (alarm timestamp - offset)
      #---------------
      - alias: 'Set helper datetime offset'
        conditions:
          - condition: trigger
            id: helper_update
          - condition: template
            value_template: >
              {% set internal_alarm_state = trigger.to_state.state %}
              {{ internal_alarm_state is not none and internal_alarm_state not in ["unknown", "unavailable"] }}
        sequence:
          - variables:
              var_alarm_offset_timestamp: >
                {{ (as_timestamp(trigger.to_state.state) | int(0)) - ((in_ji_offset | int(0)) * 60) }}

          - service: input_datetime.set_datetime
            data:
              timestamp: >
                {{ var_alarm_offset_timestamp | int(0) }}
            target:
              entity_id: !input in_alarm_helper

      #---------------
      # Case 2 - Execute wake-up actions (at helper time)
      #---------------
      - alias: 'Wake-up: run configured actions'
        conditions:
          - condition: trigger
            id: wake_up
        sequence:
          - alias: 'Someone is home'
            condition: template
            value_template: '{{ not var_bol_away_from_home }}'
            # Someone is home

          - alias: 'Stealth mode is inactive'
            condition: template
            value_template: '{{ not var_bol_stealth_mode }}'
            # Stealth mode is not active (No ninjas)

          - alias: 'Current time is outside quiet hours'
            condition: not
            conditions:
              - alias: 'Current time is within quiet hours'
                condition: time
                after: !input 'in_quiet_window_start'
                before: !input 'in_quiet_window_end'

          - sequence: !input in_actions

    default: []

#---------------
# mode
#---------------

mode: single
