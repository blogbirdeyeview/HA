# 2026-06-28
# USO - Miguel
blueprint:
  name: Prego - Config rank of sunlight - By Sun - Light inside v0.56
  description: >
    # 🔆 Config rank of sunlight

    Adjust sunrise and sunset helper times based on sun events and the amount of light inside the house.

    This blueprint recalculates the morning and night helpers from sunrise/sunset base offsets,
    and optionally readjusts them according to the indoor LDR sensor and a fixed helper with the
    maximum sun elevation reference for the day.

    Required = *
  domain: automation
  homeassistant:
    min_version: 2024.6.0
  # Tab necesario por inputs
  #
  #---------------
  # Inputs
  #---------------

  input:
    #*** Custum Time Prego
    in_time_morning:
      name: Sunrise Helper *
      description: Choose the time helper corresponding to sunrise.
      selector:
        entity:
          domain: input_datetime

    in_time_night:
      name: Sunset Helper *
      description: Choose the time helper corresponding to sunset.
      selector:
        entity:
          domain: input_datetime

    in_ldr_sensor:
      name: LDR Sensor *
      description: Sensor of the amount of light inside the house, measured in percentage.
      selector:
        entity:
          domain: sensor

    in_extra_ldr_time:
      name: Extra time due to darkness inside the house (LDR)
      description: Additional time in minutes due to darkness inside the house.
      default: 100
      selector:
        number:
          min: 10
          max: 300
          unit_of_measurement: 'min'

    in_max_sun_elevation_yesterday:
      name: Max sun elevation helper *
      description: Helper entity with the maximum sun elevation reference stored for the current day.
      selector:
        entity:
          domain: input_number

    in_extra_sun_elevation_time:
      name: Extra time due to sun elevation
      description: Additional time in minutes based on the current sun elevation percentage versus the stored maximum elevation helper.
      default: 30
      selector:
        number:
          min: 0
          max: 180
          unit_of_measurement: 'min'

    in_base_offset_morning_minutes:
      name: Base Offset for Morning
      description: Base offset in minutes to sunrise.
      default: 20
      selector:
        number:
          min: 0
          max: 120
          unit_of_measurement: 'min'

    in_base_offset_afternoon_minutes:
      name: Base Offset for Afternoon
      description: Base offset in minutes to sunset.
      default: 50
      selector:
        number:
          min: 0
          max: 120
          unit_of_measurement: 'min'

#---------------
# Variables
#---------------

variables:
  var_sensor_time_morning: !input in_time_morning
  var_sensor_time_night: !input in_time_night
  var_sensor_ldr: !input in_ldr_sensor
  var_sensor_max_sun_elevation_yesterday: !input in_max_sun_elevation_yesterday

  var_ldr: '{{ states(var_sensor_ldr) | float(0) }}'
  var_max_sun_elevation_yesterday: '{{ states(var_sensor_max_sun_elevation_yesterday) | float(0) }}'
  var_extra_ldr_time: !input in_extra_ldr_time
  var_extra_sun_elevation_time: !input in_extra_sun_elevation_time
  var_sun_elevation: "{{ state_attr('sun.sun', 'elevation') | float(0) }}"
  var_base_offset_morning_minutes: !input in_base_offset_morning_minutes
  var_base_offset_afternoon_minutes: !input in_base_offset_afternoon_minutes
  var_sunrise_time: "{{ state_attr('sun.sun', 'next_rising') }}"
  var_sunset_time: "{{ state_attr('sun.sun', 'next_setting') }}"

#---------------
# Triggers
#---------------

trigger:
  - platform: time
    at: '02:30:00'

  - platform: sun
    event: sunrise
    offset: '-03:00:00'

  - platform: sun
    event: sunrise
    offset: '-01:30:00'

  - platform: sun
    event: sunrise
    offset: '-00:30:00'

  - platform: time
    at: !input in_time_morning

  - platform: time
    at: '14:30:00'

  - platform: sun
    event: sunset
    offset: '-03:00:00'

  - platform: sun
    event: sunset
    offset: '-01:30:00'

  - platform: sun
    event: sunset
    offset: '-00:30:00'

  - platform: time
    at: !input in_time_night

  - platform: numeric_state
    entity_id: !input in_ldr_sensor
    above: 45
    below: 55
    for:
      minutes: 5

  - platform: numeric_state
    entity_id: !input in_ldr_sensor
    below: 60
    for:
      minutes: 2

  - platform: numeric_state
    entity_id: !input in_ldr_sensor
    below: 40
    for:
      minutes: 3

  - platform: numeric_state
    entity_id: !input in_ldr_sensor
    above: 50
    for:
      minutes: 5

  - platform: numeric_state
    entity_id: !input in_ldr_sensor
    above: 75
    for:
      minutes: 5

  - platform: numeric_state
    entity_id: !input in_ldr_sensor
    above: 90
    for:
      minutes: 5

#---------------
# Conditions
#---------------

#---------------
# Actions
#---------------

actions:
  - variables:
      morning_base_ts: >
        {% set offset_seconds = var_base_offset_morning_minutes * 60 %}
        {{ as_timestamp(var_sunrise_time) + offset_seconds }}

      night_base_ts: >
        {% set offset_seconds = var_base_offset_afternoon_minutes * 60 %}
        {{ as_timestamp(var_sunset_time) - offset_seconds }}

      total_adjustment_seconds: >
        {% set ldr_offset_minutes = 1 + (var_extra_ldr_time * ((100 - var_ldr) / 100)) %}
        {% set sun_reference = [var_max_sun_elevation_yesterday | float(0), 1] | max %}
        {% set sun_ratio = (var_sun_elevation | float(0)) / sun_reference %}
        {% set sun_ratio = [0, sun_ratio] | max %}
        {% set sun_ratio = [1, sun_ratio] | min %}
        {% set sun_elevation_factor = 1 - sun_ratio %}
        {% set sun_elevation_offset_minutes = var_extra_sun_elevation_time * sun_elevation_factor %}
        {{ (ldr_offset_minutes + sun_elevation_offset_minutes) * 60 }}

  - action: input_datetime.set_datetime
    target:
      entity_id: !input in_time_morning
    data:
      datetime: >
        {{ ((morning_base_ts | float(0)) + (total_adjustment_seconds | float(0)))
          | timestamp_custom('%Y-%m-%d %H:%M:%S', true) }}

  - action: input_datetime.set_datetime
    target:
      entity_id: !input in_time_night
    data:
      datetime: >
        {{ ((night_base_ts | float(0)) - (total_adjustment_seconds | float(0)))
          | timestamp_custom('%Y-%m-%d %H:%M:%S', true) }}

#---------------
# mode
#---------------

mode: single
