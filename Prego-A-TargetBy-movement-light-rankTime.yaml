# El cual es basado en:
# Basado en Prego-A-TargetBy-movement-sun.yaml

# 2026-02-14
blueprint:
  name: Prego - Automatic lights - By motion detection - rank of time v1.4
  description: >
    Automatic lights. Turns on one or more lights when motion is detected, only outside a configured quiet/sleep time window.
    Turns off the lights after a no‑motion timeout, with an optional “keep alive” sensor to prevent turning off while it indicates activity.
    Optionally prevents activation when away from home and when stealth mode is enabled.
  domain: automation
  #
  #---------------
  # input
  #---------------

  input:
    in_motion_sensor:
      name: Motion sensor
      description: Choose the motion sensor that covers the designated area for evaluation.
      selector:
        entity:
          domain: binary_sensor
    in_motion_sensor_keep_alive:
      name: Motion sensor (keep alive only)
      description: Optional sensor that prevents turning off the light if motion is still detected.
      default: ''
      selector:
        entity:
          domain: binary_sensor
    in_inactivity_timeout:
      name: No motion duration
      description: Time to trigger after no motion detected.
      default:
        hours: 0
        minutes: 2
        seconds: 0
      selector:
        duration: {}
    #*** Filter
    in_away_from_home:
      name: Are you away from home?
      description: Indicator signaling no one is at home (travel / away status).
      default: ''
      selector:
        entity:
          domain: input_boolean
    in_stealth_mode:
      name: Are you in stealth mode?
      description: Indicator signaling that you want to be a ninja at home (everyone sleeping / suspicious noise).
      default: []
      selector:
        entity:
          domain: input_boolean
          multiple: true
    in_clock_in_time:
      name: Start of period without light time (23:00:00)
      description: From what time will this automation work?
      default: '23:00:00'
      selector:
        time: {}
    in_clock_out_time:
      name: End of period without light time (07:00:00)
      description: Until what time will this automation work?
      default: '07:00:00'
      selector:
        time: {}
    #*** Action
    in_target_entity_control:
      name: Target light to control
      description: Choose the switches/lights that you want to control automatically.
      selector:
        entity:
          domain:
            - light
          multiple: true

#---------------
# variables
#---------------

trigger_variables:
  var_motion_sensor_keep_alive: !input in_motion_sensor_keep_alive
  var_away_from_home: !input in_away_from_home
  var_stealth_mode: !input in_stealth_mode
  var_target_entities: !input in_target_entity_control

variables:
  var_bol_motion_sensor_keep_alive: >
    {% if not var_motion_sensor_keep_alive %}
      {{ false }}
    {% else %}
      {{ is_state(var_motion_sensor_keep_alive, 'on') | bool }}
    {% endif %}
  var_bol_away_from_home: >
    {% if not var_away_from_home %}
      {{ false }}
    {% else %}
      {{ is_state(var_away_from_home, 'on') | bool }}
    {% endif %}
  var_bol_stealth_mode: >
    {% if not var_stealth_mode or (var_stealth_mode | length == 0) %}
      {{ false }}
    {% else %}
      {{
        (expand(var_stealth_mode)
          | selectattr('state', 'eq', 'on')
          | list
          | count > 0)
        | bool
      }}
    {% endif %}

#---------------
# Automation to turn ON when motion is detected.
#---------------

trigger:
  - platform: state
    entity_id: !input 'in_motion_sensor'
    id: trigger_motion_start
    to: 'on'
  - platform: state
    entity_id: !input 'in_motion_sensor'
    id: trigger_motion_end
    to: 'off'
    for: !input in_inactivity_timeout
  - platform: template
    id: trigger_motion_end_keep_alive
    value_template: >
      {% if var_motion_sensor_keep_alive is not none and var_motion_sensor_keep_alive != '' %}
        {{ is_state(var_motion_sensor_keep_alive, 'off') }}
      {% else %}
        false
      {% endif %}
    for: !input in_inactivity_timeout

#---------------
# conditions
#---------------

condition:
  - condition: template
    # Checks if at least one light is OFF (ready to turn ON)
    # Checks if at least one light is ON (ready to turn OFF)
    value_template: >
      {{
        (trigger.id == 'trigger_motion_start' and expand(var_target_entities) | selectattr('state','in',['off','unavailable','unknown']) | list | length > 0) 
        or
        (trigger.id == 'trigger_motion_end' and expand(var_target_entities) | selectattr('state', 'eq', 'on') | list | length > 0) 
        or
        (trigger.id == 'trigger_motion_end_keep_alive' and expand(var_target_entities) | selectattr('state', 'eq', 'on') | list | length > 0) 
        or
        (trigger.id in ['trigger_time_morning', 'trigger_time_night'])
      }}

#---------------
# Actions
#---------------

action:
  - choose:
      #---------------
      # Case 1 - To turn ON the light when motion is detected.
      #---------------
      - alias: 'Turn ON when motion detected or night begins'
        conditions:
          - condition: trigger
            id:
              - trigger_motion_start
              - trigger_time_night
        sequence:
          - condition: template
            value_template: '{{ not var_bol_away_from_home }}'
            # In home
          - condition: template
            value_template: '{{ not var_bol_stealth_mode }}'
            # No ninjas at home
          - condition: state
            entity_id: !input 'in_motion_sensor'
            state: 'on'
            # Motion detected
          - condition: not
            conditions:
              - condition: time
                after: !input 'in_clock_in_time'
                before: !input 'in_clock_out_time'

          - service: light.turn_on
            target:
              entity_id: !input 'in_target_entity_control'
            data:
              #transition: 1
              brightness_pct: >-
                {% set noon_dt = states('sensor.sun_next_noon') | as_datetime | as_local %}
                {% set noon_time = noon_dt.strftime('%H:%M:%S') %}
                {% set noon_today = today_at(noon_time) %}

                {# t = horas desde noon_today (negativo antes, positivo después) #}
                {% set t = (as_timestamp(now()) - as_timestamp(noon_today)) / 3600 %}

                {# “wrap” para ignorar fecha: que quede en el rango [-12, +12] #}
                {% if t > 12 %}{% set t = t - 24 %}{% endif %}
                {% if t < -12 %}{% set t = t + 24 %}{% endif %}

                {# triángulo continuo: 100% en t=0; 0% en t=±12 #}
                {% set raw = 100 - (t | abs) * (100/12) %}
                {{ [0, [raw, 100] | min] | max | round(0) }}

      #---------------
      # Case 2 - To turn OFF the light when movement is finished.
      #---------------
      - alias: 'Turn OFF when no motion'
        conditions:
          - condition: trigger
            id:
              - trigger_motion_end
              - trigger_motion_end_keep_alive
        sequence:
          - condition: state
            entity_id: !input 'in_motion_sensor'
            state: 'off'
          - condition: state
            entity_id: !input 'in_motion_sensor'
            state: 'off'
            for: !input in_inactivity_timeout
          - condition: template
            value_template: '{{ not var_bol_motion_sensor_keep_alive }}'
            # keep alive is OFF

          - service: homeassistant.turn_off
            target:
              entity_id: !input 'in_target_entity_control'

      #---------------
      # Case 3 - To turn OFF the light when it is daytime.
      #---------------
      - alias: 'Turn off the target - it is already morning!'
        conditions:
          - condition: trigger
            id:
              - trigger_time_morning
        sequence:
          - condition: state
            entity_id: !input 'in_motion_sensor'
            state: 'off'
          - condition: state
            entity_id: !input 'in_motion_sensor'
            state: 'off'
            for: !input in_inactivity_timeout
          - condition: template
            value_template: '{{ not var_bol_motion_sensor_keep_alive }}'

          - service: homeassistant.turn_off
            target:
              entity_id: !input 'in_target_entity_control'

mode: single
