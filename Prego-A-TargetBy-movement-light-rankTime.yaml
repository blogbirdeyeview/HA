# Basado en Prego-A-TargetBy-movement-sun-rankTime.yaml
# El cual es basado en:
# Basado en Prego-A-TargetBy-movement-sun.yaml
# IMPORTANT: depends on Prego-S-dynamic-light.yaml (script.control_dynamic_light)

# 2026-09-02
blueprint:
  name: Prego - Automatic lights - By motion detection - rank of time v2.2
  description: |
    Automatically controls one or more lights using a motion sensor and a configurable quiet/sleep time window.

    - Turns the target(s) ON when motion is detected outside the configured quiet window.
    - Turns the target(s) OFF after a configurable no-motion timeout.
    - Turns the target(s) OFF when the configured quiet window starts (if there is no motion).
    - Uses dynamic brightness when the configured brightness time is active.

    * Optional "keep-alive" motion sensor prevents turning OFF if motion is still present.
    * Optional "away-from-home" filter prevents turning ON while no one is home.
    * Optional "stealth-mode" filter prevents turning ON while one or more stealth flags are active.
    * Dynamic brightness is handled by script.control_dynamic_light.
    * Dynamic brightness ends automatically at 08:00.
    * Dynamic brightness time filtering can be skipped when explicitly enabled.
  domain: automation
  homeassistant:
    min_version: 2024.6.0
  # Tab necesario por inputs
  #
  #---------------
  # Inputs
  #---------------

  input:
    in_motion_sensor:
      name: Motion sensor
      description: Choose the motion sensor that covers the area to monitor.
      selector:
        entity:
          domain: binary_sensor

    in_motion_sensor_keep_alive:
      name: Motion sensor (keep-alive only)
      description: Optional sensor used only to prevent turning OFF the targets while motion is still detected.
      default: ''
      selector:
        entity:
          domain: binary_sensor

    in_inactivity_timeout:
      name: No-motion duration
      description: Time without motion before the automation turns the targets OFF.
      default:
        hours: 0
        minutes: 2
        seconds: 0
      selector:
        duration: {}

    #*** Filters
    in_away_from_home:
      name: Away from home
      description: Optional indicator that means nobody is currently home (travel).
      default: ''
      selector:
        entity:
          domain: input_boolean

    in_stealth_mode:
      name: Stealth mode
      description: Optional indicator(s) used to block automatic turn-on, for example when people are sleeping or you want to avoid visible activity.
      default: []
      selector:
        entity:
          domain: input_boolean
          multiple: true

    #*** Configuration
    in_enable_safeoff_post_restart:
      name: SafeOff after restart
      description: If enabled, Home Assistant will turn OFF the target devices after startup when no motion is detected.
      default: false
      selector:
        boolean:

    # Motion/light activation quiet window
    in_clock_in_time:
      name: Start of period without light time (23:00:00)
      description: From what time will this automation work?
      default: '23:00:00'
      selector:
        time: {}

    in_clock_out_time:
      name: End of period without light time (07:00:00)
      description: Until what time will this automation work?
      default: '07:00:00'
      selector:
        time: {}

    # Dynamic brightness
    in_enable_skip_time_filter:
      name: Skip dynamic brightness time filter
      description: If enabled, dynamic brightness is always used regardless of the current time.
      default: false
      selector:
        boolean: {}

    in_clock_brightness:
      name: Dynamic brightness start time
      description: Time from which dynamic brightness is used. Dynamic brightness always ends at 08:00.
      default: '20:00:00'
      selector:
        time: {}

    #*** Targets
    in_target_entity_control:
      name: Target light to control
      description: Choose the lights that should be controlled automatically.
      selector:
        entity:
          domain:
            - light
          multiple: true

#---------------
# Variables
#---------------

trigger_variables:
  var_motion_sensor_keep_alive: !input in_motion_sensor_keep_alive
  var_away_from_home: !input in_away_from_home
  var_stealth_mode: !input in_stealth_mode
  var_enable_safeoff_post_restart: !input in_enable_safeoff_post_restart
  var_target_entities: !input in_target_entity_control
  var_enable_skip_time_filter: !input in_enable_skip_time_filter
  var_clock_brightness: !input in_clock_brightness

variables:
  var_bol_motion_sensor_keep_alive: >
    {% if not var_motion_sensor_keep_alive %}
      {{ false }}
    {% else %}
      {{ is_state(var_motion_sensor_keep_alive, 'on') | bool }}
    {% endif %}
  var_bol_away_from_home: >
    {% if not var_away_from_home %}
      {{ false }}
    {% else %}
      {{ is_state(var_away_from_home, 'on') | bool }}
    {% endif %}
  var_bol_stealth_mode: >
    {% if not var_stealth_mode or (var_stealth_mode | length == 0) %}
      {{ false }}
    {% else %}
    {{
      (expand(var_stealth_mode)
      | selectattr('state', 'eq', 'on')
      | list
      | count > 0)
      | bool
    }}
    {% endif %}
  var_bol_any_target_on: >-
    {{ expand(var_target_entities)
    | selectattr('state', 'eq', 'on')
    | list
    | count > 0 }}
  var_bol_any_target_off_or_unavailable: >-
    {{ expand(var_target_entities)
    | selectattr('state', 'in', ['off', 'unavailable', 'unknown'])
    | list
    | count > 0 }}
  var_target_entities_on_names: >-
    {% set ns = namespace(items=[]) %}
    {% for entity in expand(var_target_entities) if entity.state == 'on' %}
      {% set ns.items = ns.items + [entity.name ~ ' (' ~ entity.entity_id ~ ')'] %}
    {% endfor %}
    {{ ns.items | join(', ') }}

#---------------
# Triggers
#---------------

trigger:
  - platform: state
    entity_id: !input 'in_motion_sensor'
    id: trigger_motion_start
    to: 'on'

  - platform: state
    entity_id: !input 'in_motion_sensor'
    id: trigger_motion_end
    to: 'off'
    for: !input in_inactivity_timeout

  - platform: template
    id: trigger_motion_end_keep_alive
    value_template: >
      {% if var_motion_sensor_keep_alive is not none and var_motion_sensor_keep_alive != '' %}
        {{ is_state(var_motion_sensor_keep_alive, 'off') }}
      {% else %}
        false
      {% endif %}
    for: !input in_inactivity_timeout

  - platform: time
    at: '02:00:00'
    id: trigger_time_02am

  - platform: homeassistant
    event: start
    id: trigger_ha_start

#---------------
# Conditions
#---------------

#---------------
# Actions
#---------------

action:
  - choose:
      #---------------
      # Case 1 - Turn ON the light when motion is detected.
      #---------------
      - alias: 'Turn ON when motion is detected or night begins'
        conditions:
          - condition: trigger
            id:
              - trigger_motion_start

        sequence:
          - condition: template
            value_template: '{{ not var_bol_away_from_home }}'
            # Someone is home

          - condition: template
            value_template: '{{ not var_bol_stealth_mode }}'
            # Stealth mode is not active (No ninjas)

          - alias: 'Check: at least one target is OFF'
            condition: template
            value_template: '{{ var_bol_any_target_off_or_unavailable }}'

          - condition: state
            entity_id: !input 'in_motion_sensor'
            state: 'on'
            # Motion still detected

          - condition: not
            conditions:
              - condition: time
                after: !input 'in_clock_in_time'
                before: !input 'in_clock_out_time'
          # EXTRA solo fuera de rango de tiempo

          # EXTERNO
          #---------------
          # Turn ON using dynamic brightness
          #---------------
          - action: script.control_dynamic_light
            data:
              in_target_entity_control: !input in_target_entity_control
              in_min_brightness_pct: 10
              in_max_brightness_pct: 60
              in_enable_skip_time_filter: !input in_enable_skip_time_filter
              in_clock_start_time: !input in_clock_brightness

      #---------------
      # Case 2 - Turn OFF when no motion is detected
      #---------------
      - alias: 'Turn OFF when no motion is detected'
        conditions:
          - condition: trigger
            id:
              - trigger_motion_end
              - trigger_motion_end_keep_alive

        sequence:
          - alias: 'Check: at least one target is ON'
            condition: template
            value_template: '{{ var_bol_any_target_on }}'

          - condition: state
            entity_id: !input 'in_motion_sensor'
            state: 'off'

          - condition: state
            entity_id: !input 'in_motion_sensor'
            state: 'off'
            for: !input in_inactivity_timeout

          - condition: template
            value_template: '{{ not var_bol_motion_sensor_keep_alive }}'
            # Keep-alive sensor is not detecting motion

          - service: homeassistant.turn_off
            target:
              entity_id: !input 'in_target_entity_control'

      #---------------
      # Case SAFE - Daily safety shutdown at 02:00
      #---------------
      - alias: '02:00 safety shutdown: turn OFF target(s)'
        conditions:
          - condition: trigger
            id:
              - trigger_time_02am
        sequence:
          - alias: 'Check: at least one target is ON'
            condition: template
            value_template: '{{ var_bol_any_target_on }}'

          - service: homeassistant.turn_off
            target:
              entity_id: !input 'in_target_entity_control'

          - alias: 'Notify: safety shutdown executed'
            service: persistent_notification.create
            data:
              title: >-
                02:00 safety shutdown executed - 
                {{ state_attr(this.entity_id, 'friendly_name') if this is defined and this.entity_id is defined else 'unknown automation' }}
              message: >-
                Automation: {{ state_attr(this.entity_id, 'friendly_name') if this is defined and this.entity_id is defined else 'unknown automation' }}
                ({{ this.entity_id if this is defined and this.entity_id is defined else 'unknown entity_id' }}).
                Turned off target(s): {{ var_target_entities_on_names if var_target_entities_on_names else 'unknown target(s)' }}.
                Reason: at 02:00 at least one target was still on.

      #---------------
      # Case SAFE - SafeOff after Home Assistant restart
      #---------------
      - alias: 'Post-restart SafeOff: turn OFF target(s)'
        conditions:
          - condition: trigger
            id:
              - trigger_ha_start
        sequence:
          - alias: 'Check: SafeOff after restart is enabled'
            condition: template
            value_template: '{{ var_enable_safeoff_post_restart }}'

          - alias: 'Wait for Home Assistant startup to complete'
            delay: '00:00:35'

          - alias: 'Check: no motion detected'
            condition: state
            entity_id: !input in_motion_sensor
            state: 'off'

          - alias: 'Check: at least one target is ON'
            condition: template
            value_template: '{{ var_bol_any_target_on }}'

          - service: homeassistant.turn_off
            target:
              entity_id: !input 'in_target_entity_control'

#---------------
# mode
#---------------

mode: restart
