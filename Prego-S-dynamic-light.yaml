blueprint:
  name: Prego Script - Dynamic Light Control  v5.35
  description: >-
    Turns on selected switches or lights. Dimmable lights receive dynamic
    brightness when it applies and 100% brightness otherwise. Switches are
    turned on without brightness data. All parameters are supplied by the
    calling automation.
  domain: script
  homeassistant:
    min_version: 2026.6.0
  # Required section for inputs
  #
  #---------------
  # Inputs
  #---------------

fields:
  in_target_entity_control:
    name: Target entities
    description: >-
      Switches or lights passed by the calling automation. All entities must
      have the same domain.
    required: true
    selector:
      entity:
        domain:
          - switch
          - light
        multiple: true
  in_light_transition_seconds:
    name: Light turn-on transition
    description: >-
      Time in seconds for the light to transition to the requested state.
    required: true
    selector:
      number:
        min: 0
        max: 60
        step: 1
        mode: slider
        unit_of_measurement: s
  in_enable_internal_dynamic_brightness:
    name: Enable brightness control
    description: When enabled, dynamic brightness applies inside the configured time window. Dimmable lights use 100% outside the window or when this option is disabled. Low-brightness mode can extend dynamic control outside the window.
    required: true
    selector:
      boolean: {}
  in_low_brightness_mode:
    name: Low brightness mode
    description: When enabled with brightness control, apply a stronger darkness factor and bypass the configured time window.
    required: false
    default: false
    selector:
      boolean: {}
  in_clock_start_time:
    name: Dynamic light start time
    description: Start time for dynamic brightness.
    required: true
    selector:
      time: {}
  in_clock_end_time:
    name: Dynamic light end time
    description: End time for dynamic brightness.
    required: true
    selector:
      time: {}
  in_min_brightness_pct:
    name: Minimum brightness
    description: Minimum brightness percentage.
    required: true
    selector:
      number:
        min: 1
        max: 100
        step: 1
        mode: slider
        unit_of_measurement: '%'
  in_max_brightness_pct:
    name: Maximum brightness
    description: Maximum brightness percentage.
    required: true
    selector:
      number:
        min: 1
        max: 100
        step: 1
        mode: slider
        unit_of_measurement: '%'
  in_brightness_curve_gamma:
    name: Brightness curve gamma
    description: Brightness curve exponent, from 0.1 to 5.0.
    required: true
    selector:
      number:
        min: 0.1
        max: 5.0
        step: 0.1
        mode: box

#---------------
# Actions
#---------------

sequence:
  - alias: Require all parameters from the calling automation
    if:
      - condition: template
        value_template: >-
          {{ in_target_entity_control is not defined
          or in_light_transition_seconds is not defined
          or in_enable_internal_dynamic_brightness is not defined
          or in_clock_start_time is not defined
          or in_clock_end_time is not defined
          or in_min_brightness_pct is not defined
          or in_max_brightness_pct is not defined
          or in_brightness_curve_gamma is not defined }}
    then:
      - stop: All eight script parameters must be supplied by the calling automation.
        error: true

  - alias: Resolve the target entities and their domain
    variables:
      var_target_entities: >-
        {{ in_target_entity_control }}
      var_first_target_entity: >-
        {{ (var_target_entities | trim) if var_target_entities is string else (var_target_entities | default([], true) | first | default('', true)) }}
      var_target_domain: >-
        {{ var_first_target_entity.split('.')[0] if '.' in var_first_target_entity else '' }}
      var_bol_target_domains_mixed: >-
        {% set temp_target_entities = [var_target_entities] if var_target_entities is string else (var_target_entities | default([], true)) %}
        {% set temp_target_domain_check = namespace(temp_has_mixed_domains=false) %}
        {% for entity in temp_target_entities %}
          {% if entity.split('.')[0] != var_target_domain %}
            {% set temp_target_domain_check.temp_has_mixed_domains = true %}
          {% endif %}
        {% endfor %}
        {{ temp_target_domain_check.temp_has_mixed_domains }}

  - alias: Stop when no target entities are provided
    if:
      - condition: template
        value_template: >-
          {{
            var_target_entities is none
            or (var_target_entities is string and var_target_entities | trim == '')
            or (var_target_entities is not string and var_target_entities | count == 0)
          }}
    then:
      - stop: No target entities were provided.
        error: true

  - alias: Stop when target entities mix domains
    if:
      - condition: template
        value_template: '{{ var_bol_target_domains_mixed }}'
    then:
      - stop: Target entities must all be switches or all be lights.
        error: true

  - alias: Prepare light parameters from the calling automation
    variables:
      var_light_transition_seconds: '{{ in_light_transition_seconds | int }}'
      var_bol_enable_dynamic_brightness: '{{ in_enable_internal_dynamic_brightness }}'
      var_bol_low_brightness_mode: '{{ in_low_brightness_mode | default(false) | bool }}'
      var_darkness_multiplier: '{{ 3 if (in_low_brightness_mode | default(false) | bool) else 1 }}'
      var_clock_start_time: '{{ in_clock_start_time }}'
      var_clock_end_time: '{{ in_clock_end_time }}'
      var_min_brightness_pct: '{{ in_min_brightness_pct | float }}'
      var_max_brightness_pct: '{{ in_max_brightness_pct | float }}'
      var_brightness_curve_gamma: '{{ in_brightness_curve_gamma | float }}'

  - alias: Choose the target entity domain
    choose:
      - alias: Turn on switches
        conditions:
          - condition: template
            value_template: "{{ var_target_domain == 'switch' }}"
        sequence:
          - action: switch.turn_on
            alias: Turn on target switches
            target:
              entity_id: '{{ var_target_entities }}'
          - stop: Target switches were turned on.
            error: false

      - alias: Continue with light brightness control
        conditions:
          - condition: template
            value_template: "{{ var_target_domain == 'light' }}"
        sequence: []

    default:
      - stop: Target entities must all be switches or all be lights.
        error: true

  - alias: Stop when brightness limits are invalid
    if:
      - condition: template
        value_template: >-
          {% set internal_minimum_brightness_pct = var_min_brightness_pct | float(-1) %}
          {% set internal_maximum_brightness_pct = var_max_brightness_pct | float(-1) %}
          {{ internal_minimum_brightness_pct < 1 or internal_maximum_brightness_pct > 100 or internal_minimum_brightness_pct > internal_maximum_brightness_pct }}
    then:
      - stop: Minimum brightness must be at least 1%, maximum must be at most 100%, and minimum must not exceed maximum.
        error: true

  - variables:
      var_supported_color_modes: >-
        {{ state_attr(var_first_target_entity, 'supported_color_modes') | default([], true) }}

  - variables:
      var_bol_is_dimmable: >-
        {{
          'brightness' in var_supported_color_modes
          or 'color_temp' in var_supported_color_modes
          or 'hs' in var_supported_color_modes
          or 'xy' in var_supported_color_modes
          or 'rgb' in var_supported_color_modes
          or 'rgbw' in var_supported_color_modes
          or 'rgbww' in var_supported_color_modes
          or 'white' in var_supported_color_modes
        }}

  - variables:
      var_current_time: >-
        {{ now().strftime('%H:%M:%S') }}

  - alias: Check whether current time is in the brightness window
    variables:
      var_bol_inside_brightness_window: >-
        {{
          (
            var_clock_start_time < var_clock_end_time
            and var_current_time >= var_clock_start_time
            and var_current_time < var_clock_end_time
          )
          or (
            var_clock_start_time > var_clock_end_time
            and (
              var_current_time >= var_clock_start_time
              or var_current_time < var_clock_end_time
            )
          )
        }}

  - alias: Resolve when to apply dynamic brightness
    variables:
      var_bol_apply_dynamic_brightness: >-
        {{
          var_bol_is_dimmable
          and var_bol_enable_dynamic_brightness
          and (var_bol_low_brightness_mode or var_bol_inside_brightness_window)
        }}
      var_bol_apply_full_brightness: >-
        {{ var_bol_is_dimmable and not var_bol_apply_dynamic_brightness }}

  #---------------
  # Case Choose - With light brightness
  #---------------

  - alias: Choose the light turn-on behavior
    choose:
      #---------------
      # Case 1 - Turn ON the light internal Prego case.
      #---------------
      - alias: Apply dynamic brightness
        conditions:
          - condition: template
            value_template: '{{ var_bol_apply_dynamic_brightness }}'
        sequence:
          - alias: Capture the solar-noon time
            variables:
              var_solar_noon_time: >-
                {% set temp_solar_noon_datetime = states('sensor.sun_next_noon') | as_datetime | as_local %}
                {{ temp_solar_noon_datetime.strftime('%H:%M:%S') }}

          - alias: Calculate the solar-noon time offset
            variables:
              var_hours_from_solar_noon: >-
                {% set temp_solar_noon_today = today_at(var_solar_noon_time) %}
                {% set temp_hours_from_solar_noon = (as_timestamp(now()) - as_timestamp(temp_solar_noon_today)) / 3600 %}

                {% if temp_hours_from_solar_noon > 12 %}
                  {% set temp_hours_from_solar_noon = temp_hours_from_solar_noon - 24 %}
                {% endif %}

                {% if temp_hours_from_solar_noon < -12 %}
                  {% set temp_hours_from_solar_noon = temp_hours_from_solar_noon + 24 %}
                {% endif %}

                {{ temp_hours_from_solar_noon }}

          - alias: Calculate the darkness factor
            variables:
              var_darkness_factor: >-
                {{ (var_hours_from_solar_noon | float(0) | abs) * (var_darkness_multiplier | int(1)) }}

          - alias: Calculate raw and normalized brightness
            variables:
              var_raw_brightness_pct: >-
                {{ 100 - (var_darkness_factor | float(0)) * (100 / 12) }}

          - alias: Normalize the raw brightness level
            variables:
              var_normalized_brightness: >-
                {{ [0, [var_raw_brightness_pct | float(0) / 100, 1] | min] | max }}

          - alias: Apply the brightness curve gamma
            variables:
              var_curved_brightness_factor: >-
                {{ (var_normalized_brightness | float(0)) ** (var_brightness_curve_gamma | float(1)) }}

          - alias: Scale the curved brightness to the configured range
            variables:
              var_unrounded_brightness_pct: >-
                {{
                  var_min_brightness_pct
                  + var_curved_brightness_factor
                    * (var_max_brightness_pct - var_min_brightness_pct)
                }}

          - alias: Clamp the calculated brightness percentage
            variables:
              var_calculated_brightness_pct: >-
                {{ [1, [var_unrounded_brightness_pct | round(0) | int, 100] | min] | max }}

          - alias: Log received brightness parameters and calculated level
            action: system_log.write
            data:
              level: debug
              message: >-
                Prego dynamic light calculation: received min={{ var_min_brightness_pct }}%,
                max={{ var_max_brightness_pct }}%, gamma={{ var_brightness_curve_gamma }};
                low-brightness mode={{ var_bol_low_brightness_mode }},
                darkness multiplier={{ var_darkness_multiplier }}, factor={{ var_darkness_factor | float(0) | round(2) }} h;
                solar-noon offset={{ var_hours_from_solar_noon | float(0) | round(2) }} h;
                raw={{ var_raw_brightness_pct | float(0) | round(2) }}%;
                normalized={{ var_normalized_brightness | float(0) | round(4) }};
                gamma curve={{ var_curved_brightness_factor | float(0) | round(4) }};
                calculated={{ var_calculated_brightness_pct }}%.

          - action: light.turn_on
            alias: Turn on with dynamic brightness
            target:
              entity_id: '{{ var_target_entities }}'
            data:
              transition: '{{ var_light_transition_seconds | int }}'
              brightness_pct: '{{ var_calculated_brightness_pct }}'

      #---------------
      # Case 2 - Turn ON the light.
      #---------------
      - alias: Turn on at full brightness when dynamic brightness is not active
        conditions:
          - condition: template
            value_template: '{{ var_bol_apply_full_brightness }}'
        sequence:
          - alias: Log the full-brightness path
            action: system_log.write
            data:
              level: debug
              message: >-
                Prego dynamic light calculation: selected full-brightness path because dynamic brightness is disabled or outside its configured window;
                brightness enabled={{ var_bol_enable_dynamic_brightness }}, dimmable={{ var_bol_is_dimmable }};
                current={{ var_current_time }}, window={{ var_clock_start_time }}-{{ var_clock_end_time }};
                received min={{ var_min_brightness_pct }}%, max={{ var_max_brightness_pct }}%,
                gamma={{ var_brightness_curve_gamma }}; 
                calculated=100%.

          - action: light.turn_on
            alias: Turn on at 100% brightness
            target:
              entity_id: '{{ var_target_entities }}'
            data:
              transition: '{{ var_light_transition_seconds | int }}'
              brightness_pct: 100

    #---------------
    # Save case - Turn ON the light.
    #---------------
    default:
      - alias: Log unchanged-brightness path and received parameters
        action: system_log.write
        data:
          level: debug
          message: >-
            Prego dynamic light calculation: selected unchanged-brightness path;
            brightness enabled={{ var_bol_enable_dynamic_brightness }}, dimmable={{ var_bol_is_dimmable }};
            current={{ var_current_time }}, window={{ var_clock_start_time }}-{{ var_clock_end_time }};
            received min={{ var_min_brightness_pct }}%, max={{ var_max_brightness_pct }}%,
            gamma={{ var_brightness_curve_gamma }}; 
            calculated=unchanged.

      - action: light.turn_on
        alias: Turn on without changing brightness
        target:
          entity_id: '{{ var_target_entities }}'

#---------------
# mode
#---------------

mode: parallel
max: 10
max_exceeded: warning
