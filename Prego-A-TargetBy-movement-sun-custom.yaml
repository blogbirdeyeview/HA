# Basado en Prego-A-TargetBy-movement-sun.yaml
# USO - Miguel
# 2025-11-22
blueprint:
  name: Prego - Automatic switches/lights custom - By motion detection & sun v1.19
  description: >
    Automatic switches/lights. Allows you to automatically (custom light switch on by script) control the target based on motion detection and the lack of sunlight.
    The automation optionally includes features such as preventing activation when away from home and considering stealth mode.
  domain: automation

  #---------------
  # input
  #---------------

  input:
    in_motion_sensor:
      name: Motion sensor
      description: Choose the motion sensor that covers the designated area for evaluation.
      selector:
        entity:
          domain: binary_sensor
    in_inactivity_timeout:
      name: No motion duration
      description: Time to trigger after no motion detected.
      default:
        hours: 0
        minutes: 2
        seconds: 0
      selector:
        duration: {}
    #*** Filter
    in_away_from_home:
      name: Are you away from home?
      description: Indicator signaling no one is at home (travel / away status).
      default: ''
      selector:
        entity:
          domain: input_boolean
    in_stealth_mode:
      name: Are you in stealth mode?
      description: Indicator signaling that you want to be a ninja at home (everyone sleeping / suspicious noise).
      default: []
      selector:
        entity:
          domain: input_boolean
          multiple: true
    in_time_morning:
      name: Sunrise Helper
      description: Choose the time helper corresponding to sunrise.
      selector:
        entity:
          integration: input_datetime
    in_time_night:
      name: Sunset Helper
      description: Choose the time helper corresponding to sunset.
      selector:
        entity:
          integration: input_datetime
    #*** Action
    in_target_entity_control:
      name: Target switch/light to control
      description: Choose the switches/lights that you want to control automatically.
      selector:
        entity:
          domain:
            - switch
            - light
          multiple: true
    in_actions_on:
      name: Actions ON
      description: Actions to run to Turn ON (custom)
      default: []
      selector:
        action: {}

#---------------
# variables
#---------------

variables:
  var_away_from_home: !input in_away_from_home
  var_stealth_mode: !input in_stealth_mode
  var_target_entities: !input in_target_entity_control
  var_bol_away_from_home: >
    {% if not var_away_from_home %}
      {{ false }}
    {% else %}
      {{ is_state(var_away_from_home, 'on') | bool }}
    {% endif %}
  var_bol_stealth_mode: >
    {% if not var_stealth_mode or (var_stealth_mode | length == 0) %}
      {{ false }}
    {% else %}
      {{
        (expand(var_stealth_mode)
          | selectattr('state', 'eq', 'on')
          | list
          | count > 0)
        | bool
      }}
    {% endif %}

#---------------
# Automatizacion para encender la luz al detectar movimiento.
#---------------

trigger:
  - platform: state
    entity_id: !input 'in_motion_sensor'
    id: trigger_motion_start
    to: 'on'
  - platform: state
    entity_id: !input 'in_motion_sensor'
    id: trigger_motion_end
    to: 'off'
    for: !input in_inactivity_timeout
  - platform: time
    id: trigger_time_morning
    at: !input 'in_time_morning'
  - platform: time
    id: trigger_time_night
    at: !input 'in_time_night'

#---------------
# conditions
#---------------

condition:
  - condition: template
    # Verifica si al menos una luz está apagada (lista para encender)
    # Verifica si al menos una luz está encendida (lista para apagar)
    value_template: >
      {{
        (trigger.id == 'trigger_motion_start' and expand(var_target_entities) | selectattr('state','in',['off','unavailable','unknown']) | list | length > 0) 
        or
        (trigger.id == 'trigger_motion_end' and expand(var_target_entities) | selectattr('state', 'eq', 'on') | list | length > 0) 
        or
        (trigger.id in ['trigger_time_morning', 'trigger_time_night'])
      }}

#---------------
# Actions
#---------------

action:
  - choose:
      - alias: 'Turn ON when motion detected or night begins'
        conditions:
          #---------------
          # Case 1 - To turn ON the light when motion is detected.
          #---------------
          - condition: trigger
            id:
              - trigger_motion_start
              - trigger_time_night
        sequence:
          - condition: template
            value_template: '{{ not var_bol_away_from_home }}'
            # In home
          - condition: template
            value_template: '{{ not var_bol_stealth_mode }}'
            # No ninjas at home
          - condition: state
            entity_id: !input 'in_motion_sensor'
            state: 'on'
            # Motion detected
          - condition: or
            conditions:
              - condition: time
                after: !input 'in_time_night'
                # After time
              - condition: time
                before: !input 'in_time_morning'
                # Before time
          # CUSTOM para turn ON
          - sequence: !input in_actions_on

      - alias: 'Turn OFF when no motion'
        conditions:
          #---------------
          # Case 2 - To turn OFF the light when movement is finished.
          #---------------
          - condition: trigger
            id:
              - trigger_motion_end
        sequence:
          - condition: state
            entity_id: !input 'in_motion_sensor'
            state: 'off'
          - service: homeassistant.turn_off
            target:
              entity_id: !input 'in_target_entity_control'

      - alias: 'Turn OFF at sunrise'
        conditions:
          #---------------
          # Case 3 - To turn OFF the light when it is daytime.
          #---------------
          - condition: trigger
            id:
              - trigger_time_morning
        sequence:
          - service: homeassistant.turn_off
            target:
              entity_id: !input 'in_target_entity_control'

mode: single
