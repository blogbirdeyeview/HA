# Last release for Prego-A-TargetBy-brightness-sun-rankTime.yaml
# IMPORTANT: depends on an instance of Prego-S-dynamic-light.yaml (default: script.prego_dynamic_light_control_v4_XX)

# 2026-11-23
blueprint:
  name: Prego - Automatic switches/lights - By motion detection & brightness & sun - rank of time vX.93
  description: |
    Automatically controls switches and lights based on motion, sunlight, and your quiet/sleep time window.

    - Turns the target(s) ON when motion is detected and conditions allow.
    - Turns the target(s) OFF after the selected no-motion time. An optional keep-alive sensor can prevent turn-off while motion continues.
    - Turns the target(s) OFF any target still on at 02:00 as a daily safety measure.
    - Every automatic turn-ON must pass BOTH enabled restrictions: darkness (sunset to sunrise) AND outside the quiet/blocking window. Neither restriction overrides the other.
    - With the darkness restriction enabled, automatic turn-ON is allowed only from the sunset helper time until the sunrise helper time. Sunrise turns targets OFF only when both motion sensors are clear; sunset requests turn-ON only with main-sensor motion and all restrictions satisfied.
    - With the quiet restriction enabled, its start/end times define a BLOCKED interval, not an allowed interval. This block applies even during darkness. Its start turns targets OFF only when both motion sensors are clear; its end requests turn-ON only with main-sensor motion and all restrictions satisfied.
    - The internal brightness window selects the brightness controller only. It is NOT an additional turn-ON permission window.
    - Optional turns targets OFF after Home Assistant restarts when no motion is detected.
    - Optional automatic brightness control for lights works with Prego dynamic brightness and HACS Adaptive Lighting.
    - Optional ZHA button toggles the targets with a single click or turns them ON at 100% with a double click.

    * Away-from-home and stealth options can prevent automatic turn-ON.
  domain: automation
  homeassistant:
    min_version: 2026.8.0
  # Required section for inputs
  #
  #---------------
  # Inputs
  #---------------

  input:
    in_motion_sensor:
      name: Motion sensor
      description: Choose the motion sensor that covers the area to monitor.
      selector:
        entity:
          domain: binary_sensor

    in_motion_sensor_keep_alive:
      name: Keep-alive motion sensor
      description: Optional sensor that delays shutoff while it detects motion.
      default: ''
      selector:
        entity:
          domain: binary_sensor

    in_button_zha_device:
      name: Manual button (ZHA)
      description: >-
        Optional ZHA button. A single click toggles the targets: turns them ON if all are off,
        or OFF if any is on. A double click turns the targets ON at 100%. Both actions ignore
        darkness, quiet hours, away and stealth restrictions.
        Leave empty to disable.
      default: ''
      selector:
        device:
          filter:
            - integration: zha

    in_inactivity_timeout:
      name: No-motion duration
      description: Time without motion before the targets can turn off.
      default:
        hours: 0
        minutes: 2
        seconds: 0
      selector:
        duration: {}

    #*** Filters
    in_away_from_home:
      name: Away from home
      description: Optional helper that indicates when nobody is home.
      default: ''
      selector:
        entity:
          domain: input_boolean

    in_stealth_mode:
      name: Stealth mode
      description: Optional helpers that block automatic activation while any of them is on.
      default: []
      selector:
        entity:
          domain: input_boolean
          multiple: true

    #*** Configuration
    in_enable_safeoff_post_restart:
      name: SafeOff after restart
      description: Turn off the targets after Home Assistant starts if the main motion sensor is clear.
      default: false
      selector:
        boolean:

    collapsed_quiet_window_schedule:
      name: Automatic turn-on restrictions
      icon: mdi:clock-outline
      description: >-
        Use darkness, quiet hours, or both to control when targets can turn on automatically. Quiet hours block turn-on even during darkness.
      collapsed: true
      input:
        # --- Sun-window behavior
        in_enable_sun_window_behavior:
          name: Allow automatic turn-on only during darkness
          description: Allow automatic turn-on between sunset and sunrise. Sunset can turn targets on if motion is detected. Sunrise turns them off when both motion sensors are clear.
          default: false
          selector:
            boolean: {}

        #*** Custum Time Prego
        in_time_morning:
          name: Sunrise time helper
          description: >-
            Time-only helper that marks when darkness ends. Leave blank to use input_datetime.prego_sunrise.
          default: ''
          selector:
            entity:
              domain: input_datetime

        in_time_night:
          name: Sunset time helper
          description: >-
            Time-only helper that marks when darkness starts. Leave blank to use input_datetime.prego_sunset.
          default: ''
          selector:
            entity:
              domain: input_datetime
        # ---

        # --- Quiet-window behavior
        in_enable_quiet_window_behavior:
          name: Block automatic turn-on during quiet hours
          description: Block automatic turn-on during quiet hours. When they begin, targets turn off if both motion sensors are clear. When they end, motion can turn targets on if the other restrictions allow it.
          default: false
          selector:
            boolean: {}

        # Motion config quiet window
        in_quiet_window_start:
          name: Quiet hours start
          description: Start time for quiet hours, when automatic activation is blocked.
          default: '23:00:00'
          selector:
            time: {}

        in_quiet_window_end:
          name: Quiet hours end
          description: End time for quiet hours, when automatic activation can resume.
          default: '07:00:00'
          selector:
            time: {}
        # ---

    # ─────────────────────────────
    # Internal brightness control
    # ─────────────────────────────
    # collapsed Dynamic internal brightness - START
    collapsed_advanced_brightness:
      name: Internal brightness control
      icon: mdi:brightness-auto
      description: >
        Optional dynamic brightness schedule and Adaptive Lighting coordination for light targets.
      collapsed: true
      input:
        in_enable_internal_dynamic_brightness:
          name: Enable dynamic brightness
          description: Adjust dimmable lights during the configured brightness window. Low brightness mode can extend dynamic brightness beyond that window.
          default: false
          selector:
            boolean: {}

        in_adaptive_lighting_adapt_brightness_switch:
          name: HACS Adaptive Lighting brightness switch
          description: >-
            Optional. This switch is disabled while internal dynamic brightness
            is active and enabled outside that window or when internal
            brightness is disabled. If omitted or unavailable, it is left
            unchanged.
          default: ''
          selector:
            entity:
              domain: switch
              integration: adaptive_lighting

        in_dynamic_brightness_script:
          name: Internal dynamic brightness script
          description: >-
            Optional. Select a script instance created from
            Prego-S-dynamic-light.yaml. Leave empty to use
            script.prego_script_dynamic_light_control_v4_18_2.
          default: ''
          selector:
            entity:
              filter:
                - domain: script

        in_low_brightness_mode:
          name: Low brightness mode
          description: >-
            Dims lights more and extends dynamic brightness beyond its scheduled hours when dynamic brightness is enabled.
          default: ''
          selector:
            entity:
              domain: input_boolean

        in_clock_start_brightness:
          name: Dynamic brightness start time
          description: Time when the scheduled dynamic brightness period begins.
          default: '20:00:00'
          selector:
            time: {}
        in_clock_end_brightness:
          name: Dynamic brightness end time
          description: Time when the scheduled dynamic brightness period ends.
          default: '08:00:00'
          selector:
            time: {}

        in_min_brightness_pct:
          name: Minimum dynamic brightness
          description: >-
            Lowest brightness percentage during dynamic brightness control.
          default: 20
          selector:
            number:
              min: 1
              max: 100
              step: 1
              mode: slider
              unit_of_measurement: '%'

        in_max_brightness_pct:
          name: Maximum dynamic brightness
          description: >-
            Highest brightness percentage during dynamic brightness control.
          default: 100
          selector:
            number:
              min: 1
              max: 100
              step: 1
              mode: slider
              unit_of_measurement: '%'

        in_brightness_curve_gamma:
          name: Dynamic brightness curve gamma
          description: >-
            Higher values make the lights dim faster as it gets darker. The minimum and maximum brightness stay the same.
          default: 1.0
          selector:
            number:
              min: 0.1
              max: 5.0
              step: 0.1
              mode: box
    # collapsed Dynamic internal brightness - END

    in_light_transition_seconds:
      name: Light turn-on transition
      description: >-
        Seconds for the light to reach the selected brightness. Use 0 for an immediate change.
      default: 0
      selector:
        number:
          min: 0
          max: 60
          step: 1
          mode: slider
          unit_of_measurement: s

    #*** Targets
    in_target_entity_control:
      name: Target switches or lights
      description: Select the switches or lights to control. All targets must be the same entity type.
      selector:
        entity:
          domain:
            - switch
            - light
          multiple: true

#---------------
# Variables
#---------------

trigger_variables:
  trigger_var_ji_low_brightness_mode: !input in_low_brightness_mode
  trigger_var_ji_motion_sensor_keep_alive: !input in_motion_sensor_keep_alive
  trigger_var_ji_enable_sun_window_behavior: !input in_enable_sun_window_behavior
  trigger_var_ji_time_morning: !input in_time_morning
  trigger_var_ji_time_night: !input in_time_night
  trigger_var_ji_button_zha_device: !input in_button_zha_device

variables:
  in_ji_low_brightness_mode: !input in_low_brightness_mode
  in_ji_motion_sensor_keep_alive: !input in_motion_sensor_keep_alive
  in_ji_away_from_home: !input in_away_from_home
  in_ji_stealth_mode: !input in_stealth_mode
  in_ji_enable_safeoff_post_restart: !input in_enable_safeoff_post_restart
  in_ji_target_entity_control: !input in_target_entity_control
  var_target_entities: '{{ in_ji_target_entity_control }}'
  in_ji_enable_sun_window_behavior: !input in_enable_sun_window_behavior
  in_ji_time_morning: !input in_time_morning
  in_ji_time_night: !input in_time_night
  in_ji_enable_quiet_window_behavior: !input in_enable_quiet_window_behavior
  in_ji_enable_internal_dynamic_brightness: !input in_enable_internal_dynamic_brightness
  in_ji_adaptive_lighting_adapt_brightness_switch: !input in_adaptive_lighting_adapt_brightness_switch
  in_ji_clock_start_brightness: !input in_clock_start_brightness
  in_ji_clock_end_brightness: !input in_clock_end_brightness
  in_ji_dynamic_brightness_script: !input in_dynamic_brightness_script
  in_ji_button_zha_device: !input in_button_zha_device
  var_target_action: 'none'
  var_bol_manual_button_action: false
  var_bol_button_device_is_snzb01p: >-
    {{
      in_ji_button_zha_device | default('', true) != ''
      and device_attr(in_ji_button_zha_device, 'manufacturer') == 'eWeLink'
      and device_attr(in_ji_button_zha_device, 'model') == 'SNZB-01P'
    }}
  var_dynamic_brightness_script: >-
    {{ in_ji_dynamic_brightness_script | default('script.prego_script_dynamic_light_control_v4_18_2', true) }}
  #--- Block-var
  # Intentional duplicate of the script's brightness-window check, used only to
  # synchronize Adaptive Lighting before target-action routing. It also honors
  # low-brightness mode and keeps the same window boundary semantics.
  var_bol_low_brightness_mode: >-
    {% set temp_low_brightness_entity_id = in_ji_low_brightness_mode | default('', true) %}
    {{ temp_low_brightness_entity_id != '' and is_state(temp_low_brightness_entity_id, 'on') }}
  var_bol_enable_internal_dynamic_brightness: '{{ in_ji_enable_internal_dynamic_brightness }}'
  #--- Block-var
  var_bol_internal_dynamic_brightness_active: >-
    {% set temp_current_time = now().strftime('%H:%M:%S') %}
    {% set temp_brightness_window_start_time = in_ji_clock_start_brightness %}
    {% set temp_brightness_window_end_time = in_ji_clock_end_brightness %}
    {% set temp_low_brightness_entity_id = in_ji_low_brightness_mode | default('', true) %}
    {% set temp_low_brightness_mode_enabled = temp_low_brightness_entity_id != '' and is_state(temp_low_brightness_entity_id, 'on') %}
    {{
      (trigger is defined and (trigger.id | default('')) in ['trigger_button_value_two', 'trigger_button_snzb_double_click'])
      or (
        in_ji_enable_internal_dynamic_brightness | bool
        and (
          temp_low_brightness_mode_enabled
          or (temp_brightness_window_start_time < temp_brightness_window_end_time and temp_current_time >= temp_brightness_window_start_time and temp_current_time < temp_brightness_window_end_time)
          or (temp_brightness_window_start_time > temp_brightness_window_end_time and (temp_current_time >= temp_brightness_window_start_time or temp_current_time < temp_brightness_window_end_time))
        )
      )
    }}
  #--- Block-var
  var_bol_motion_sensor_keep_alive: >
    {% if not in_ji_motion_sensor_keep_alive %}
      {{ false }}
    {% else %}
      {{ is_state(in_ji_motion_sensor_keep_alive, 'on') | bool }}
    {% endif %}
  #--- Block-var
  var_bol_away_from_home: >
    {% if not in_ji_away_from_home %}
      {{ false }}
    {% else %}
      {{ is_state(in_ji_away_from_home, 'on') | bool }}
    {% endif %}
  #--- Block-var
  var_bol_stealth_mode: >
    {% if not in_ji_stealth_mode or (in_ji_stealth_mode | length == 0) %}
      {{ false }}
    {% else %}
    {{
      (expand(in_ji_stealth_mode)
      | selectattr('state', 'eq', 'on')
      | list
      | count > 0)
      | bool
    }}
    {% endif %}
  #--- Block-var
  var_bol_any_target_on: >-
    {{ expand(in_ji_target_entity_control)
    | selectattr('state', 'eq', 'on')
    | list
    | count > 0 }}
  #--- Block-var
  var_target_entities_on_names: >-
    {% set temp_target_name_list = namespace(temp_entity_names=[]) %}
    {% for temp_target_entity in expand(in_ji_target_entity_control) if temp_target_entity.state == 'on' %}
      {% set temp_target_name_list.temp_entity_names = temp_target_name_list.temp_entity_names + [temp_target_entity.name ~ ' (' ~ temp_target_entity.entity_id ~ ')'] %}
    {% endfor %}
    {{ temp_target_name_list.temp_entity_names | join(', ') }}

#---------------
# Triggers
#---------------

triggers:
  - trigger: state
    alias: Motion detected
    entity_id: !input 'in_motion_sensor'
    id: trigger_motion_start
    to: 'on'

  #--- Button Start
  - trigger: event
    alias: ZHA button single click (SNZB-01P toggle command)
    enabled: "{{ trigger_var_ji_button_zha_device != '' }}"
    event_type: zha_event
    event_data:
      device_id: !input in_button_zha_device
      command: toggle
      args: []
    id: trigger_button_snzb_toggle

  - trigger: event
    alias: ZHA button double click (SNZB-01P ON command)
    enabled: "{{ trigger_var_ji_button_zha_device != '' }}"
    event_type: zha_event
    event_data:
      device_id: !input in_button_zha_device
      command: 'on'
    id: trigger_button_snzb_double_click

  - trigger: event
    alias: ZHA button single click (value argument)
    enabled: "{{ trigger_var_ji_button_zha_device != '' }}"
    event_type: zha_event
    event_data:
      device_id: !input in_button_zha_device
      args:
        value: 1
    id: trigger_button_value_one

  - trigger: event
    alias: ZHA button double click (value argument)
    enabled: "{{ trigger_var_ji_button_zha_device != '' }}"
    event_type: zha_event
    event_data:
      device_id: !input in_button_zha_device
      args:
        value: 2
    id: trigger_button_value_two
  #--- Button End

  - trigger: state
    alias: No motion for the configured timeout
    entity_id: !input 'in_motion_sensor'
    id: trigger_motion_end
    to: 'off'
    for: !input in_inactivity_timeout

  - trigger: template
    alias: Keep-alive sensor is clear for the configured timeout
    id: trigger_motion_end_keep_alive
    value_template: >
      {% if trigger_var_ji_motion_sensor_keep_alive is not none and trigger_var_ji_motion_sensor_keep_alive != '' %}
        {{ is_state(trigger_var_ji_motion_sensor_keep_alive, 'off') }}
      {% else %}
        false
      {% endif %}
    for: !input in_inactivity_timeout

  - trigger: time
    alias: Sunrise
    enabled: >-
      {{ trigger_var_ji_enable_sun_window_behavior | bool }}
    id: trigger_time_morning
    at: >-
      {{ trigger_var_ji_time_morning | default('input_datetime.prego_sunrise', true) }}

  - trigger: time
    alias: Sunset
    enabled: >-
      {{ trigger_var_ji_enable_sun_window_behavior | bool }}
    id: trigger_time_night
    at: >-
      {{ trigger_var_ji_time_night | default('input_datetime.prego_sunset', true) }}

  - trigger: time
    alias: Quiet hours start
    at: !input in_quiet_window_start
    id: trigger_quiet_window_start

  - trigger: time
    alias: Quiet hours end
    at: !input in_quiet_window_end
    id: trigger_quiet_window_end

  - trigger: time
    alias: Dynamic brightness start time
    at: !input in_clock_start_brightness
    id: trigger_internal_brightness_start

  - trigger: time
    alias: Dynamic brightness end time
    at: !input in_clock_end_brightness
    id: trigger_internal_brightness_end

  - trigger: template
    alias: Low brightness mode turns on
    value_template: "{{ trigger_var_ji_low_brightness_mode and is_state(trigger_var_ji_low_brightness_mode, 'on') }}"
    id: trigger_low_brightness_mode_changed

  - trigger: template
    alias: Low brightness mode turns off
    value_template: "{{ trigger_var_ji_low_brightness_mode and is_state(trigger_var_ji_low_brightness_mode, 'off') }}"
    id: trigger_low_brightness_mode_changed

  - trigger: time
    alias: Daily 02:00 safety shutdown
    at: '02:00:00'
    id: trigger_time_02am

  - trigger: homeassistant
    alias: Home Assistant started
    event: start
    id: trigger_ha_start

#---------------
# Conditions
#---------------

#---------------
# Actions
#---------------

actions:
  - alias: 'Resolve sunrise and sunset helper entities'
    variables:
      var_sunrise_helper: >-
        {{ in_ji_time_morning | default('input_datetime.prego_sunrise', true) }}
      var_sunset_helper: >-
        {{ in_ji_time_night | default('input_datetime.prego_sunset', true) }}

  #---------------
  # [Check] Synchronize brightness control
  #---------------
  - alias: 'Synchronize the Adaptive Lighting switch with internal brightness control'
    if:
      - alias: 'The selected Adaptive Lighting switch exists and is available'
        condition: template
        value_template: >-
          {% set internal_adaptive_lighting_switch_entity_id = in_ji_adaptive_lighting_adapt_brightness_switch | default('', true) %}
          {{
            internal_adaptive_lighting_switch_entity_id != ''
            and internal_adaptive_lighting_switch_entity_id.split('.')[0] == 'switch'
            and states(internal_adaptive_lighting_switch_entity_id) in ['on', 'off']
          }}
    then:
      - alias: 'Set the HACS switch to match the active brightness controller'
        choose:
          - alias: 'Disable HACS brightness while an internal or forced-brightness action is active'
            conditions:
              - alias: 'Internal brightness or a forced-brightness action is active'
                condition: template
                value_template: '{{ var_bol_internal_dynamic_brightness_active }}'
              - alias: 'HACS brightness is currently on'
                condition: template
                value_template: >-
                  {{ is_state(in_ji_adaptive_lighting_adapt_brightness_switch, 'on') }}
            sequence:
              - alias: 'Turn off HACS Adaptive Lighting brightness'
                action: switch.turn_off
                target:
                  entity_id: '{{ in_ji_adaptive_lighting_adapt_brightness_switch }}'

          - alias: 'Enable HACS brightness when internal brightness control is disabled and no override is active'
            conditions:
              - alias: 'Internal brightness control is disabled and no forced-brightness action is active'
                condition: template
                value_template: '{{ not (in_ji_enable_internal_dynamic_brightness | bool) and not var_bol_internal_dynamic_brightness_active }}'
              - alias: 'HACS brightness is currently off'
                condition: template
                value_template: >-
                  {{ is_state(in_ji_adaptive_lighting_adapt_brightness_switch, 'off') }}
            sequence:
              - alias: 'Turn on HACS Adaptive Lighting brightness'
                action: switch.turn_on
                target:
                  entity_id: '{{ in_ji_adaptive_lighting_adapt_brightness_switch }}'

          - alias: 'Enable HACS brightness outside the internal brightness window'
            conditions:
              - alias: 'Internal brightness control is enabled'
                condition: template
                value_template: '{{ in_ji_enable_internal_dynamic_brightness | bool }}'
              - alias: 'Current time is outside the internal brightness window'
                condition: template
                value_template: '{{ not var_bol_internal_dynamic_brightness_active }}'
              - alias: 'HACS brightness is currently off'
                condition: template
                value_template: >-
                  {{ is_state(in_ji_adaptive_lighting_adapt_brightness_switch, 'off') }}
            sequence:
              - alias: 'Turn on HACS Adaptive Lighting brightness'
                action: switch.turn_on
                target:
                  entity_id: '{{ in_ji_adaptive_lighting_adapt_brightness_switch }}'

  #---------------
  # [Check] Botton Check
  #---------------
  - alias: 'Skip value triggers matched from the SNZB-01P'
    if:
      - alias: 'Triggered by an Aqara value trigger'
        condition: trigger
        id:
          - trigger_button_value_one
          - trigger_button_value_two
      - alias: 'The configured device is the SNZB-01P'
        condition: template
        value_template: '{{ var_bol_button_device_is_snzb01p }}'
    then:
      - stop: 'Ignore the value trigger duplicated by the SNZB-01P'

  #---------------
  # [Choose Path] Resolve requested target action
  #---------------
  - alias: 'Resolve the target action for the active trigger'
    choose:
      #---------------
      # Case 1 - Turn ON the light when motion is detected.
      #---------------
      - alias: 'Turn on when motion is detected'
        conditions:
          - alias: 'Triggered by motion start'
            condition: trigger
            id:
              - trigger_motion_start

        sequence:
          - alias: 'Someone is home'
            condition: template
            value_template: '{{ not var_bol_away_from_home }}'
            # Someone is home

          - alias: 'Stealth mode is inactive'
            condition: template
            value_template: '{{ not var_bol_stealth_mode }}'
            # Stealth mode is not active (No ninjas)

          # Keep the brightness script reachable on motion even when all targets are already on.
          - alias: 'Motion is still detected'
            condition: state
            entity_id: !input 'in_motion_sensor'
            state: 'on'
            # Motion still detected

          - alias: 'Set the requested target action to turn on'
            variables:
              var_target_action: 'turn_on'

      #---------------
      # Case 2 - Turn OFF when no motion is detected
      #---------------
      - alias: 'Turn off when the no-motion timeout expires'
        conditions:
          - alias: 'Triggered by motion end'
            condition: trigger
            id:
              - trigger_motion_end
              - trigger_motion_end_keep_alive

        sequence:
          - alias: 'At least one target is on'
            condition: template
            value_template: '{{ var_bol_any_target_on }}'

          - alias: 'Motion sensor is clear'
            condition: state
            entity_id: !input 'in_motion_sensor'
            state: 'off'

          - alias: 'Motion sensor has stayed off for the timeout'
            condition: state
            entity_id: !input 'in_motion_sensor'
            state: 'off'
            for: !input in_inactivity_timeout

          - alias: 'Keep-alive sensor is not detecting motion'
            condition: template
            value_template: '{{ not var_bol_motion_sensor_keep_alive }}'
            # Keep-alive sensor is not detecting motion

          - alias: 'Set the requested target action to turn off'
            variables:
              var_target_action: 'turn_off'

      #---------------
      # Case 3 Manual - To toggle the light.
      #---------------
      - alias: 'Toggle targets from the manual ZHA button'
        conditions:
          - alias: 'Triggered by a configured ZHA button event'
            condition: trigger
            id:
              - trigger_button_snzb_toggle
              - trigger_button_value_one
          - alias: 'A ZHA button is configured'
            condition: template
            value_template: "{{ in_ji_button_zha_device | default('', true) != '' }}"
        sequence:
          - alias: 'Choose turn OFF if any target is already ON'
            if:
              - alias: 'At least one target is on'
                condition: template
                value_template: '{{ var_bol_any_target_on }}'
            then:
              - alias: 'Set the requested target action to turn off'
                variables:
                  var_target_action: 'turn_off'
            else:
              - alias: 'Set the requested target action to turn on'
                variables:
                  var_target_action: 'turn_on'

          - alias: 'Mark this as a manual button action'
            variables:
              var_bol_manual_button_action: true

      #---------------
      # Case 4 Manual - To turn ON at 100% from a ZHA double click.
      #---------------
      - alias: 'Turn ON targets at 100% from the ZHA double-click trigger'
        conditions:
          - alias: 'Triggered by the ZHA double-click device trigger'
            condition: trigger
            id:
              - trigger_button_snzb_double_click
              - trigger_button_value_two
          - alias: 'A ZHA button is configured'
            condition: template
            value_template: "{{ in_ji_button_zha_device | default('', true) != '' }}"
        sequence:
          - alias: 'Set the requested target action to turn on'
            variables:
              var_target_action: 'turn_on'

          - alias: 'Mark this as a manual button action'
            variables:
              var_bol_manual_button_action: true

          - alias: 'Disable dynamic and low brightness modes for this action'
            variables:
              var_bol_enable_internal_dynamic_brightness: false
              var_bol_low_brightness_mode: false

      #---------------
      # Case 10 Manual - COntrol brightness --> low brightness mode changes.
      #---------------
      - alias: 'Manual - Request a brightness refresh when low brightness mode changes'
        conditions:
          - condition: trigger
            id: trigger_low_brightness_mode_changed
          - condition: template
            value_template: '{{ var_bol_enable_internal_dynamic_brightness | bool }}'
        sequence:
          - alias: 'At least one target is on'
            condition: template
            value_template: '{{ var_bol_any_target_on }}'

          - variables:
              var_target_action: 'refresh_brightness'

      #---------------
      # Case 99 Scheduled - To turn OFF the light when it is daytime.
      #---------------
      - alias: 'Handle the sunrise shutdown'
        conditions:
          - alias: 'Triggered by sunrise'
            condition: trigger
            id:
              - trigger_time_morning
          - alias: 'Sun-window behavior is enabled'
            condition: template
            value_template: '{{ in_ji_enable_sun_window_behavior | bool }}'
          - alias: 'Sunrise helper has a valid time'
            condition: template
            value_template: >-
              {{ var_sunrise_helper | default('', true) != ''
              and states(var_sunrise_helper) not in
              ['unknown', 'unavailable']
              and state_attr(var_sunrise_helper, 'has_time')
              | default(false) | bool }}

        sequence:
          - alias: 'At least one target is on'
            condition: template
            value_template: '{{ var_bol_any_target_on }}'

          - alias: 'Motion sensor is clear'
            condition: state
            entity_id: !input 'in_motion_sensor'
            state: 'off'

          - alias: 'Keep-alive sensor is not detecting motion'
            condition: template
            value_template: '{{ not var_bol_motion_sensor_keep_alive }}'

          - alias: 'Set the requested target action to turn off'
            variables:
              var_target_action: 'turn_off'

      #---------------
      # Case 99 Scheduled - To turn ON at sunset
      #---------------
      - alias: 'Turn on at sunset when motion is detected'
        conditions:
          - alias: 'Triggered by sunset'
            condition: trigger
            id:
              - trigger_time_night
          - alias: 'Sun-window behavior is enabled'
            condition: template
            value_template: '{{ in_ji_enable_sun_window_behavior | bool }}'
          - alias: 'Sunset helper has a valid time'
            condition: template
            value_template: >-
              {{ var_sunset_helper | default('', true) != ''
              and states(var_sunset_helper) not in
              ['unknown', 'unavailable']
              and state_attr(var_sunset_helper, 'has_time')
              | default(false) | bool }}

        sequence:
          - alias: 'Someone is home'
            condition: template
            value_template: '{{ not var_bol_away_from_home }}'

          - alias: 'Stealth mode is inactive'
            condition: template
            value_template: '{{ not var_bol_stealth_mode }}'

          - alias: 'Motion is still detected'
            condition: state
            entity_id: !input 'in_motion_sensor'
            state: 'on'

          - alias: 'Set the requested target action to turn on'
            variables:
              var_target_action: 'turn_on'

      #---------------
      # Case 99 Scheduled - To turn ON at quiet-window boundaries
      #---------------
      - alias: 'Turn on when quiet hours end if motion is detected'
        conditions:
          - alias: 'Triggered by the end of quiet hours'
            condition: trigger
            id:
              - trigger_quiet_window_end
          - alias: 'Quiet hours are enabled'
            condition: template
            value_template: '{{ in_ji_enable_quiet_window_behavior | bool }}'
        sequence:
          - alias: 'Someone is home'
            condition: template
            value_template: '{{ not var_bol_away_from_home }}'
            # Someone is home

          - alias: 'Stealth mode is inactive'
            condition: template
            value_template: '{{ not var_bol_stealth_mode }}'
            # Stealth mode is not active (No ninjas)

          - alias: 'Motion is still detected'
            condition: state
            entity_id: !input 'in_motion_sensor'
            state: 'on'
            # Motion still detected

          - alias: 'Set the requested target action to turn on'
            variables:
              var_target_action: 'turn_on'

      #---------------
      # Case 99 Scheduled - To turn OFF at quiet-window boundaries
      #---------------
      - alias: 'Turn off when quiet hours start if there is no motion'
        conditions:
          - alias: 'Triggered by the start of quiet hours'
            condition: trigger
            id:
              - trigger_quiet_window_start
          - alias: 'Quiet hours are enabled'
            condition: template
            value_template: '{{ in_ji_enable_quiet_window_behavior | bool }}'
        sequence:
          - alias: 'Motion sensor is clear'
            condition: state
            entity_id: !input in_motion_sensor
            state: 'off'

          - alias: 'Keep-alive sensor is not detecting motion'
            condition: template
            value_template: '{{ not var_bol_motion_sensor_keep_alive }}'

          - alias: 'At least one target is on'
            condition: template
            value_template: '{{ var_bol_any_target_on }}'

          - alias: 'Set the requested target action to turn off'
            variables:
              var_target_action: 'turn_off'

      #---------------
      # Case SAFE - Daily safety shutdown at 02:00
      #---------------
      - alias: 'Turn off targets during the 02:00 safety shutdown'
        conditions:
          - alias: 'Triggered by the 02:00 safety timer'
            condition: trigger
            id:
              - trigger_time_02am
        sequence:
          - alias: 'At least one target is on'
            condition: template
            value_template: '{{ var_bol_any_target_on }}'

          - alias: 'Notify when the daily safety shutdown turns off targets'
            action: persistent_notification.create
            data:
              title: >-
                02:00 safety shutdown executed -
                {{ state_attr(this.entity_id, 'friendly_name') if this is defined and this.entity_id is defined else 'unknown automation' }}
              message: >-
                Automation: {{ state_attr(this.entity_id, 'friendly_name') if this is defined and this.entity_id is defined else 'unknown automation' }}
                ({{ this.entity_id if this is defined and this.entity_id is defined else 'unknown entity_id' }}).
                Turned off target(s): {{ var_target_entities_on_names if var_target_entities_on_names else 'unknown target(s)' }}.
                Reason: at 02:00 at least one target was still on.

          - alias: 'Turn off targets during the daily safety shutdown'
            action: homeassistant.turn_off
            target:
              entity_id: !input in_target_entity_control

      #---------------
      # Case SAFE - SafeOff after Home Assistant restart
      #---------------
      - alias: 'Run SafeOff after restart'
        conditions:
          - alias: 'Triggered by Home Assistant startup'
            condition: trigger
            id:
              - trigger_ha_start
        sequence:
          - alias: 'SafeOff after restart is enabled'
            condition: template
            value_template: '{{ in_ji_enable_safeoff_post_restart }}'

          - alias: 'Wait for Home Assistant startup to complete'
            delay: '00:00:35'

          - alias: 'Motion sensor is clear'
            condition: state
            entity_id: !input in_motion_sensor
            state: 'off'

          - alias: 'At least one target is on'
            condition: template
            value_template: '{{ var_bol_any_target_on }}'

          - alias: 'Set the requested target action to turn off'
            variables:
              var_target_action: 'turn_off'

  #---------------
  # [To Do] Main choose split
  #---------------
  - alias: 'Execute the resolved target action'
    choose:
      #---------------
      # Case ON
      #---------------
      - alias: 'Turn ON targets using the selected brightness method'
        conditions:
          - alias: 'The requested target action is turn on'
            condition: template
            value_template: "{{ var_target_action == 'turn_on' }}"
        sequence:
          - alias: 'Require darkness when the darkness restriction is enabled'
            condition: or
            conditions:
              - alias: 'The darkness restriction is disabled'
                condition: template
                value_template: '{{ not (in_ji_enable_sun_window_behavior | bool) }}'
              - alias: 'Current time is between sunset and sunrise'
                condition: template
                value_template: >-
                  {% set internal_sunrise_hour = state_attr(var_sunrise_helper, 'hour') %}
                  {% set internal_sunrise_minute = state_attr(var_sunrise_helper, 'minute') %}
                  {% set internal_sunrise_second = state_attr(var_sunrise_helper, 'second') %}
                  {% set internal_sunset_hour = state_attr(var_sunset_helper, 'hour') %}
                  {% set internal_sunset_minute = state_attr(var_sunset_helper, 'minute') %}
                  {% set internal_sunset_second = state_attr(var_sunset_helper, 'second') %}
                  {% set internal_sunrise_is_valid =
                    states(var_sunrise_helper) not in ['unknown', 'unavailable']
                    and state_attr(var_sunrise_helper, 'has_time') | default(false) | bool
                    and internal_sunrise_hour is not none
                    and internal_sunrise_minute is not none
                    and internal_sunrise_second is not none %}
                  {% set internal_sunset_is_valid =
                    states(var_sunset_helper) not in ['unknown', 'unavailable']
                    and state_attr(var_sunset_helper, 'has_time') | default(false) | bool
                    and internal_sunset_hour is not none
                    and internal_sunset_minute is not none
                    and internal_sunset_second is not none %}
                  {% if internal_sunrise_is_valid and internal_sunset_is_valid %}
                    {% set internal_current_time_seconds = now().hour * 3600 + now().minute * 60 + now().second %}
                    {% set internal_sunrise_time_seconds = internal_sunrise_hour * 3600 + internal_sunrise_minute * 60 + internal_sunrise_second %}
                    {% set internal_sunset_time_seconds = internal_sunset_hour * 3600 + internal_sunset_minute * 60 + internal_sunset_second %}
                    {{ internal_current_time_seconds >= internal_sunset_time_seconds or internal_current_time_seconds < internal_sunrise_time_seconds }}
                  {% else %}
                    false
                  {% endif %}
              - alias: 'The request came from the manual button'
                condition: template
                value_template: '{{ var_bol_manual_button_action }}'

          - alias: 'Require being outside quiet hours even during darkness'
            condition: or
            conditions:
              - alias: 'The quiet-hours restriction is disabled'
                condition: template
                value_template: '{{ not (in_ji_enable_quiet_window_behavior | bool) }}'
              - alias: 'Current time is outside quiet hours'
                condition: not
                conditions:
                  - alias: 'Current time is within quiet hours'
                    condition: time
                    after: !input 'in_quiet_window_start'
                    before: !input 'in_quiet_window_end'
              - alias: 'The request came from the manual button'
                condition: template
                value_template: '{{ var_bol_manual_button_action }}'

          # External
          #---------------
          # Turn ON using dynamic brightness
          #---------------
          - alias: 'Turn on targets using the selected brightness method'
            action: >-
              {{ var_dynamic_brightness_script }}
            data: &brightness_script_data
              in_target_entity_control: '{{ var_target_entities }}'
              in_enable_internal_dynamic_brightness: '{{ var_bol_enable_internal_dynamic_brightness | bool }}'
              in_clock_start_time: !input in_clock_start_brightness
              in_clock_end_time: !input in_clock_end_brightness
              in_min_brightness_pct: !input in_min_brightness_pct
              in_max_brightness_pct: !input in_max_brightness_pct
              in_brightness_curve_gamma: !input in_brightness_curve_gamma
              in_light_transition_seconds: !input in_light_transition_seconds
              in_low_brightness_mode: '{{ var_bol_low_brightness_mode | bool }}'

      - alias: 'Refresh brightness on lights that are already on'
        conditions:
          - condition: template
            value_template: "{{ var_target_action == 'refresh_brightness' }}"
        sequence:
          - repeat:
              for_each: >-
                {{ expand(in_ji_target_entity_control)
                   | selectattr('domain', 'eq', 'light')
                   | selectattr('state', 'eq', 'on')
                   | map(attribute='entity_id') | list }}
              sequence:
                - condition: template
                  value_template: "{{ is_state(repeat.item, 'on') }}"
                - variables:
                    var_target_entities: '{{ [repeat.item] }}'
                - alias: 'Apply the selected brightness to this light'
                  action: '{{ var_dynamic_brightness_script }}'
                  data: *brightness_script_data

      #---------------
      # Case OFF
      #---------------
      - alias: 'Turn off target(s)'
        conditions:
          - alias: 'The requested target action is turn off'
            condition: template
            value_template: "{{ var_target_action == 'turn_off' }}"
        sequence:
          - alias: 'Turn off the selected target(s)'
            action: homeassistant.turn_off
            target:
              entity_id: !input in_target_entity_control

#---------------
# mode
#---------------

mode: restart
